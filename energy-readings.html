<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PHED Meter Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', Arial, sans-serif;
    background: #f4f6fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
}

.app-card {
    width: 100%;
    max-width: 480px;
    background: white;
    border-radius: 32px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.08),
        0 8px 24px rgba(0,0,0,.04);
    padding: 24px 20px 30px;
}

h1 {
    font-size: 24px;
    font-weight: 700;
    color: #0b1b33;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
}

h1 small {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    color: #5e6f8d;
    background: #eef2f7;
    padding: 5px 10px;
    border-radius: 30px;
}

/* FEEDER */

.feeder-section {
    background: #f8faff;
    border-radius: 20px;
    padding: 16px 18px;
    margin-bottom: 20px;
    border: 1px solid #e6edf5;
}

.feeder-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #2c3e5c;
    margin-bottom: 7px;
}

.feeder-select {
    width: 100%;
    padding: 14px 16px;
    background: white;
    border: 1px solid #d0dcec;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 500;
    color: #0b1b33;
    cursor: pointer;
}

/* CAMERA */

.camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #081426;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid #d0dcec;
    margin-bottom: 16px;
}

.camera-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: rgba(255,255,255,.7);
    font-size: 15px;
    line-height: 1.5;
}

/* LCD VIEWFINDER */

.viewfinder-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;

    display: flex;
    justify-content: center;
    align-items: center;
}

.viewfinder-box {
    position: relative;

    /*
       The IEDMI Mk6E LCD is wide and short.
       Keep the box wide enough for the entire display.
    */
    width: 88%;
    height: 25%;

    border: 3px solid #00ff64;
    border-radius: 8px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.48),
        inset 0 0 25px rgba(0,255,100,.12);

    animation: pulse-border 2s ease-in-out infinite;
}

.viewfinder-box::before,
.viewfinder-box::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: #00ff64;
    border-style: solid;
}

.viewfinder-box::before {
    left: -3px;
    top: -3px;
    border-width: 5px 0 0 5px;
}

.viewfinder-box::after {
    right: -3px;
    bottom: -3px;
    border-width: 0 5px 5px 0;
}

.corner-bl,
.corner-tr {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: #00ff64;
    border-style: solid;
}

.corner-bl {
    left: -3px;
    bottom: -3px;
    border-width: 0 0 5px 5px;
}

.corner-tr {
    right: -3px;
    top: -3px;
    border-width: 5px 5px 0 0;
}

.scan-line {
    position: absolute;
    left: 4%;
    right: 4%;
    height: 2px;
    background: #00ff64;
    box-shadow: 0 0 10px #00ff64;
    animation: scan 2.2s ease-in-out infinite;
    opacity: .7;
}

.viewfinder-label {
    position: absolute;
    left: 50%;
    bottom: -34px;
    transform: translateX(-50%);

    white-space: nowrap;

    background: rgba(0,0,0,.75);
    color: white;

    padding: 4px 12px;
    border-radius: 20px;

    font-size: 10px;
    font-weight: 600;
    letter-spacing: .7px;
}

@keyframes pulse-border {

    0%,100% {
        border-color: rgba(0,255,100,.8);
    }

    50% {
        border-color: rgba(0,255,100,.35);
    }
}

@keyframes scan {

    0% {
        top: 8%;
    }

    50% {
        top: 88%;
    }

    100% {
        top: 8%;
    }
}

/* BUTTONS */

.camera-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.btn {
    flex: 1;
    min-width: 100px;
    padding: 14px 10px;

    border: none;
    border-radius: 50px;

    font-size: 14px;
    font-weight: 600;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    cursor: pointer;
    transition: .15s;
}

.btn:disabled {
    opacity: .45;
    pointer-events: none;
}

.btn-primary {
    background: #1a3a6b;
    color: white;
}

.btn-primary:hover {
    background: #102b50;
}

.btn-success {
    background: #0f7b3a;
    color: white;
}

.btn-outline {
    background: white;
    color: #2c3e5c;
    border: 1px solid #d0dcec;
}

/* READING */

.reading-panel {
    background: #f8faff;
    border-radius: 22px;
    padding: 18px;
    border: 1px solid #e6edf5;
    margin-bottom: 18px;
}

.reading-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.reading-label {
    color: #2c3e5c;
    font-size: 14px;
    font-weight: 600;
}

.reading-value {
    color: #0b1b33;
    background: white;
    border: 1px solid #d0dcec;
    border-radius: 50px;
    padding: 7px 18px;

    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;

    min-width: 140px;
    text-align: center;
}

.reading-value.empty {
    color: #8a9bb5;
    font-size: 17px;
    font-weight: 400;
}

.unit {
    font-size: 12px;
    font-weight: 600;
    color: #5e6f8d;
    margin-left: 4px;
}

.reading-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.reading-meta span {
    background: #eef2f7;
    color: #5e6f8d;
    padding: 4px 10px;
    border-radius: 30px;
    font-size: 11px;
}

/* CONFIRM */

.confirm-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.entries-list {
    margin-top: 16px;
    border-top: 1px dashed #d0dcec;
    padding-top: 10px;
    max-height: 160px;
    overflow-y: auto;
}

.entry-item {
    display: flex;
    justify-content: space-between;
    gap: 8px;

    padding: 8px 0;
    border-bottom: 1px solid #edf2f8;

    font-size: 13px;
}

.feeder-tag {
    color: #1a3a6b;
    font-weight: 600;
}

.reading-tag {
    color: #0b1b33;
    font-weight: 700;
}

/* SUBMIT */

.submit-area {
    display: flex;
    gap: 10px;
}

.btn-submit {
    flex: 2;

    background: #0f7b3a;
    color: white;

    border: none;
    border-radius: 50px;

    padding: 16px;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.btn-clear {
    flex: 1;

    background: #eef2f7;
    color: #3d4f6e;

    border: none;
    border-radius: 50px;

    font-weight: 600;
    cursor: pointer;
}

/* STATUS */

.toast {
    margin-top: 14px;

    background: #1f2a44;
    color: white;

    border-radius: 50px;
    padding: 9px 15px;

    text-align: center;
    font-size: 13px;
}

.toast.success {
    background: #0f7b3a;
}

.toast.ocr {
    background: #2a4a7a;
}

.footer-note {
    text-align: center;
    margin-top: 18px;
    padding-top: 15px;

    border-top: 1px solid #e6edf5;

    color: #7b8aa3;
    font-size: 11px;
}

.spinner {
    width: 16px;
    height: 16px;

    border: 3px solid rgba(255,255,255,.3);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media(max-width:480px) {

    body {
        padding: 10px;
    }

    .app-card {
        padding: 18px 14px 24px;
        border-radius: 26px;
    }

    .viewfinder-box {
        width: 90%;
        height: 25%;
    }

    .reading-value {
        font-size: 22px;
        min-width: 125px;
    }
}

</style>
</head>

<body>

<div class="app-card">

    <h1>
        📟 Meter Reader
        <small>LCD OCR</small>
    </h1>

    <!-- FEEDER -->

    <div class="feeder-section">

        <label class="feeder-label">
            🔌 Select feeder
        </label>

        <select id="feederSelect" class="feeder-select">

            <option value="Feeder A">
                Feeder A · Main
            </option>

            <option value="Feeder B">
                Feeder B · Backup
            </option>

            <option value="Feeder C">
                Feeder C · Solar
            </option>

            <option value="Feeder D">
                Feeder D · Generator
            </option>

            <option value="Feeder E">
                Feeder E · Sub-station
            </option>

        </select>

    </div>

    <!-- CAMERA -->

    <div class="camera-box" id="cameraContainer">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="captureCanvas"
            style="display:none;">
        </canvas>

        <div
            class="placeholder"
            id="cameraPlaceholder">

            📷 Camera ready<br>

            <span style="font-size:12px;">
                Align the green LCD display inside the box
            </span>

        </div>

        <div
            class="viewfinder-overlay"
            id="viewfinderOverlay">

            <div
                class="viewfinder-box"
                id="viewfinderBox">

                <div class="corner-bl"></div>
                <div class="corner-tr"></div>

                <div class="scan-line"></div>

                <div class="viewfinder-label">
                    ALIGN LCD DISPLAY HERE
                </div>

            </div>

        </div>

    </div>

    <!-- CAMERA BUTTONS -->

    <div class="camera-actions">

        <button
            class="btn btn-primary"
            id="captureBtn">

            📸 Capture & Read

        </button>

        <button
            class="btn btn-outline"
            id="toggleCameraBtn">

            📷 Restart

        </button>

    </div>

    <!-- READING -->

    <div class="reading-panel">

        <div class="reading-row">

            <span class="reading-label">
                📊 Meter reading
            </span>

            <span
                class="reading-value empty"
                id="currentReadingDisplay">

                —

            </span>

        </div>

        <div class="reading-meta">

            <span id="unitDisplay">
                kWh
            </span>

            <span id="feederDisplay">
                Feeder A
            </span>

            <span id="timestampDisplay">
                —
            </span>

            <span
                id="ocrConfidenceDisplay"
                style="display:none;">
            </span>

        </div>

        <div class="confirm-area">

            <button
                class="btn btn-success"
                id="confirmReadingBtn"
                disabled>

                ✅ Confirm & Register

            </button>

            <button
                class="btn btn-outline"
                id="discardReadingBtn">

                ✕ Discard

            </button>

        </div>

        <div
            class="entries-list"
            id="entriesList">

            <div style="
                color:#8a9bb5;
                text-align:center;
                padding:8px;
                font-size:13px;">

                No readings registered yet

            </div>

        </div>

    </div>

    <!-- SUBMIT -->

    <div class="submit-area">

        <button
            class="btn-submit"
            id="submitToSheetsBtn"
            disabled>

            📤 Submit to Google Sheets

        </button>

        <button
            class="btn-clear"
            id="clearEntriesBtn">

            🗑️ Clear

        </button>

    </div>

    <div
        id="statusMessage"
        class="toast"
        style="display:none;">

        Ready

    </div>

    <div class="footer-note">

        ⚡ IEDMI Mk6E LCD Reader · Tesseract OCR<br>
        <strong>Reads only the meter display</strong>

    </div>

</div>


<script>

(function() {

    /* =========================================================
       DOM
    ========================================================= */

    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("captureCanvas");

    const ctx =
        canvas.getContext("2d");

    const cameraContainer =
        document.getElementById("cameraContainer");

    const viewfinderBox =
        document.getElementById("viewfinderBox");

    const placeholder =
        document.getElementById("cameraPlaceholder");

    const viewfinderOverlay =
        document.getElementById("viewfinderOverlay");

    const captureBtn =
        document.getElementById("captureBtn");

    const toggleCameraBtn =
        document.getElementById("toggleCameraBtn");

    const feederSelect =
        document.getElementById("feederSelect");

    const currentReadingDisplay =
        document.getElementById("currentReadingDisplay");

    const feederDisplay =
        document.getElementById("feederDisplay");

    const timestampDisplay =
        document.getElementById("timestampDisplay");

    const ocrConfidenceDisplay =
        document.getElementById("ocrConfidenceDisplay");

    const confirmBtn =
        document.getElementById("confirmReadingBtn");

    const discardBtn =
        document.getElementById("discardReadingBtn");

    const entriesList =
        document.getElementById("entriesList");

    const submitBtn =
        document.getElementById("submitToSheetsBtn");

    const clearBtn =
        document.getElementById("clearEntriesBtn");

    const statusMessage =
        document.getElementById("statusMessage");


    /* =========================================================
       STATE
    ========================================================= */

    let stream = null;

    let cameraActive = false;

    let isProcessing = false;

    let currentExtractedReading = null;

    let currentOcrConfidence = 0;

    let lastCaptureTime = null;

    let registeredEntries = [];


    /* =========================================================
       STATUS
    ========================================================= */

    function showStatus(
        message,
        success = false,
        ocr = false
    ) {

        statusMessage.style.display = "block";

        statusMessage.textContent = message;

        statusMessage.className =
            "toast" +
            (success ? " success" : "") +
            (ocr ? " ocr" : "");

        clearTimeout(
            statusMessage._timer
        );

        statusMessage._timer =
            setTimeout(() => {

                statusMessage.style.display =
                    "none";

            }, 5000);

    }


    /* =========================================================
       UPDATE UI
    ========================================================= */

    function updateUI() {

        if (currentExtractedReading) {

            currentReadingDisplay.innerHTML =
                `${currentExtractedReading}<span class="unit">kWh</span>`;

            currentReadingDisplay.className =
                "reading-value";

            confirmBtn.disabled = false;

            if (currentOcrConfidence > 0) {

                ocrConfidenceDisplay.style.display =
                    "inline";

                ocrConfidenceDisplay.textContent =
                    `OCR ${Math.round(currentOcrConfidence)}%`;

            }

        } else {

            currentReadingDisplay.textContent =
                "—";

            currentReadingDisplay.className =
                "reading-value empty";

            confirmBtn.disabled = true;

            ocrConfidenceDisplay.style.display =
                "none";

        }

        feederDisplay.textContent =
            feederSelect.value;

        if (lastCaptureTime) {

            timestampDisplay.textContent =
                new Date(
                    lastCaptureTime
                ).toLocaleTimeString();

        } else {

            timestampDisplay.textContent =
                "—";

        }


        /* ENTRIES */

        if (registeredEntries.length === 0) {

            entriesList.innerHTML = `
                <div style="
                    color:#8a9bb5;
                    text-align:center;
                    padding:8px;
                    font-size:13px;">
                    No readings registered yet
                </div>
            `;

        } else {

            entriesList.innerHTML =
                registeredEntries.map(entry => {

                    return `
                        <div class="entry-item">

                            <span class="feeder-tag">
                                ${escapeHTML(entry.feeder)}
                            </span>

                            <span class="reading-tag">
                                ${escapeHTML(entry.reading)} kWh
                            </span>

                            <span style="
                                color:#5e6f8d;
                                font-size:11px;">
                                ${escapeHTML(entry.time)}
                            </span>

                        </div>
                    `;

                }).join("");

        }

        submitBtn.disabled =
            registeredEntries.length === 0;

    }


    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================================
       CAMERA
    ========================================================= */

    async function startCamera() {

        try {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                stream = null;

            }

            const constraints = {

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                }

            };

            stream =
                await navigator.mediaDevices
                    .getUserMedia(constraints);

            video.srcObject = stream;

            await video.play();

            cameraActive = true;

            placeholder.style.display =
                "none";

            video.style.display =
                "block";

            viewfinderOverlay.style.display =
                "flex";

            showStatus(
                "📷 Camera ready — align the LCD inside the green box",
                true
            );

        } catch (error) {

            console.error(
                "Camera error:",
                error
            );

            cameraActive = false;

            video.style.display =
                "none";

            placeholder.style.display =
                "flex";

            viewfinderOverlay.style.display =
                "none";

            showStatus(
                "❌ Camera access failed. Please allow camera access."
            );

        }

        updateUI();

    }


    function stopCamera() {

        if (stream) {

            stream
                .getTracks()
                .forEach(track => track.stop());

            stream = null;

        }

        cameraActive = false;

        video.style.display =
            "none";

        placeholder.style.display =
            "flex";

        viewfinderOverlay.style.display =
            "none";

    }


    /* =========================================================
       GET THE ACTUAL VIEWFINDER CROP
       This fixes the major problem in the old version.
    ========================================================= */

    function getViewfinderCrop() {

        const videoRect =
            video.getBoundingClientRect();

        const boxRect =
            viewfinderBox.getBoundingClientRect();

        const videoWidth =
            video.videoWidth;

        const videoHeight =
            video.videoHeight;

        if (
            !videoWidth ||
            !videoHeight
        ) {
            return null;
        }


        /*
           Because the video uses object-fit: cover,
           calculate the visible video area first.
        */

        const containerRatio =
            videoRect.width /
            videoRect.height;

        const videoRatio =
            videoWidth /
            videoHeight;

        let displayedWidth;
        let displayedHeight;
        let offsetX;
        let offsetY;

        if (videoRatio > containerRatio) {

            /*
               Video is wider than container.
            */

            displayedHeight =
                videoRect.height;

            displayedWidth =
                displayedHeight *
                videoRatio;

            offsetX =
                (displayedWidth -
                 videoRect.width) / 2;

            offsetY = 0;

        } else {

            /*
               Video is taller than container.
            */

            displayedWidth =
                videoRect.width;

            displayedHeight =
                displayedWidth /
                videoRatio;

            offsetX = 0;

            offsetY =
                (displayedHeight -
                 videoRect.height) / 2;

        }


        const x =
            (boxRect.left -
             videoRect.left +
             offsetX) *
            (videoWidth /
             displayedWidth);

        const y =
            (boxRect.top -
             videoRect.top +
             offsetY) *
            (videoHeight /
             displayedHeight);

        const width =
            boxRect.width *
            (videoWidth /
             displayedWidth);

        const height =
            boxRect.height *
            (videoHeight /
             displayedHeight);


        return {

            x: Math.max(0, x),

            y: Math.max(0, y),

            width: Math.min(
                width,
                videoWidth - x
            ),

            height: Math.min(
                height,
                videoHeight - y
            )

        };

    }


    /* =========================================================
       CREATE LCD IMAGE
       Enlarges and enhances the green LCD.
    ========================================================= */

    function createProcessedImages() {

        const crop =
            getViewfinderCrop();

        if (!crop) {
            return [];
        }


        /*
           Use a large OCR image.
        */

        const scale = 4;

        const sourceCanvas =
            document.createElement("canvas");

        sourceCanvas.width =
            Math.max(
                1,
                Math.round(crop.width)
            );

        sourceCanvas.height =
            Math.max(
                1,
                Math.round(crop.height)
            );

        const sourceCtx =
            sourceCanvas.getContext("2d");

        sourceCtx.drawImage(

            video,

            crop.x,
            crop.y,
            crop.width,
            crop.height,

            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height

        );


        const width =
            sourceCanvas.width * scale;

        const height =
            sourceCanvas.height * scale;


        /*
           Image 1:
           Enlarged grayscale
        */

        const grayCanvas =
            document.createElement("canvas");

        grayCanvas.width = width;
        grayCanvas.height = height;

        const grayCtx =
            grayCanvas.getContext("2d");

        grayCtx.imageSmoothingEnabled = true;

        grayCtx.drawImage(
            sourceCanvas,
            0,
            0,
            width,
            height
        );

        let imageData =
            grayCtx.getImageData(
                0,
                0,
                width,
                height
            );

        const data =
            imageData.data;


        /*
           Convert LCD image to grayscale
           and increase contrast.
        */

        for (
            let i = 0;
            i < data.length;
            i += 4
        ) {

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            /*
               Green-sensitive luminance.
               This works well with the green LCD.
            */

            let gray =
                (0.20 * r) +
                (0.70 * g) +
                (0.10 * b);


            /*
               Increase contrast.
            */

            gray =
                ((gray - 90) * 1.8) + 90;

            gray =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gray
                    )
                );

            data[i] = gray;
            data[i + 1] = gray;
            data[i + 2] = gray;

        }

        grayCtx.putImageData(
            imageData,
            0,
            0
        );


        /*
           Image 2:
           Binary threshold.
        */

        const thresholdCanvas =
            document.createElement("canvas");

        thresholdCanvas.width =
            width;

        thresholdCanvas.height =
            height;

        const thresholdCtx =
            thresholdCanvas.getContext("2d");

        thresholdCtx.drawImage(
            grayCanvas,
            0,
            0
        );

        let thresholdData =
            thresholdCtx.getImageData(
                0,
                0,
                width,
                height
            );

        const thresholdPixels =
            thresholdData.data;


        for (
            let i = 0;
            i < thresholdPixels.length;
            i += 4
        ) {

            const value =
                thresholdPixels[i];

            const output =
                value > 150
                    ? 255
                    : 0;

            thresholdPixels[i] =
                output;

            thresholdPixels[i + 1] =
                output;

            thresholdPixels[i + 2] =
                output;

        }

        thresholdCtx.putImageData(
            thresholdData,
            0,
            0
        );


        /*
           Image 3:
           Slightly softer grayscale.
        */

        const softCanvas =
            document.createElement("canvas");

        softCanvas.width =
            width;

        softCanvas.height =
            height;

        const softCtx =
            softCanvas.getContext("2d");

        softCtx.filter =
            "contrast(180%) brightness(105%)";

        softCtx.drawImage(
            sourceCanvas,
            0,
            0,
            width,
            height
        );


        return [

            grayCanvas.toDataURL(
                "image/png"
            ),

            thresholdCanvas.toDataURL(
                "image/png"
            ),

            softCanvas.toDataURL(
                "image/png"
            )

        ];

    }


    /* =========================================================
       OCR TEXT NORMALIZATION
    ========================================================= */

    function normalizeOCRText(text) {

        if (!text) {
            return "";
        }

        return text

            .replace(/[OoQq]/g, "0")

            .replace(/[IiLl|]/g, "1")

            .replace(/[Ss]/g, "5")

            .replace(/[Bb]/g, "8")

            .replace(/,/g, ".")

            .replace(/\s+/g, " ")

            .trim();

    }


    /* =========================================================
       EXTRACT THE METER READING
    ========================================================= */

    function extractMeterReading(text) {

        const normalized =
            normalizeOCRText(text);

        console.log(
            "Normalized OCR:",
            normalized
        );


        /*
           Look for numbers containing
           at least 4 digits.

           Examples accepted:

           67847.7
           12345.6
           987654.3
           123456
        */

        const matches =
            normalized.match(
                /\d[\d\s]{3,11}(?:[.,]\s*\d{1,3})?/g
            ) || [];


        const candidates = [];


        for (
            const match of matches
        ) {

            let value =
                match

                    .replace(/\s+/g, "")

                    .replace(/,/g, ".");


            /*
               Remove accidental multiple dots.
            */

            const firstDot =
                value.indexOf(".");

            if (firstDot !== -1) {

                value =
                    value.substring(
                        0,
                        firstDot + 1
                    ) +
                    value
                        .substring(firstDot + 1)
                        .replace(/\./g, "");

            }


            const numeric =
                parseFloat(value);


            /*
               Meter readings should be
               positive and reasonably sized.
            */

            if (
                Number.isFinite(numeric) &&
                numeric >= 100 &&
                numeric <= 99999999
            ) {

                candidates.push({
                    value: value,
                    numeric: numeric
                });

            }

        }


        /*
           Fallback:
           Search directly for long
           digit sequences.
        */

        if (
            candidates.length === 0
        ) {

            const fallback =
                normalized.match(
                    /\d{4,8}(?:\.\d{1,3})?/g
                ) || [];

            fallback.forEach(value => {

                const numeric =
                    parseFloat(value);

                if (
                    Number.isFinite(numeric) &&
                    numeric >= 100 &&
                    numeric <= 99999999
                ) {

                    candidates.push({
                        value,
                        numeric
                    });

                }

            });

        }


        if (
            candidates.length === 0
        ) {

            return null;

        }


        /*
           Prefer a decimal reading.

           The IEDMI display in your photo
           is 67847.7.
        */

        const decimalCandidate =
            candidates.find(
                item =>
                    item.value.includes(".")
            );


        if (decimalCandidate) {

            return decimalCandidate.value;

        }


        /*
           Otherwise use the longest
           plausible number.
        */

        candidates.sort(
            (a, b) =>
                b.value.length -
                a.value.length
        );

        return candidates[0].value;

    }


    /* =========================================================
       PERFORM ONE OCR PASS
    ========================================================= */

    async function runOCR(imageData) {

        const result =
            await Tesseract.recognize(

                imageData,

                "eng",

                {

                    logger: function(message) {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const percent =
                                Math.round(
                                    message.progress *
                                    100
                                );

                            if (
                                percent % 20 === 0
                            ) {

                                showStatus(
                                    `🔍 Reading LCD ${percent}%...`,
                                    false,
                                    true
                                );

                            }

                        }

                    },

                    tessedit_char_whitelist:
                        "0123456789.,",

                    /*
                       PSM 7 =
                       Treat image as one text line.
                    */

                    tessedit_pageseg_mode: 7,

                    preserve_interword_spaces: 0

                }

            );


        console.log(
            "OCR raw:",
            result.data.text
        );

        console.log(
            "OCR confidence:",
            result.data.confidence
        );


        return {

            text:
                result.data.text,

            confidence:
                result.data.confidence

        };

    }


    /* =========================================================
       MULTI-PASS OCR
    ========================================================= */

    async function performOCR() {

        const images =
            createProcessedImages();

        if (
            !images ||
            images.length === 0
        ) {

            return null;

        }


        const results = [];


        /*
           Run the three enhanced versions.
        */

        for (
            let i = 0;
            i < images.length;
            i++
        ) {

            try {

                const result =
                    await runOCR(
                        images[i]
                    );

                const reading =
                    extractMeterReading(
                        result.text
                    );

                if (reading) {

                    results.push({

                        reading:
                            reading,

                        confidence:
                            result.confidence || 0,

                        raw:
                            result.text

                    });

                }

            } catch (error) {

                console.error(
                    "OCR pass error:",
                    error
                );

            }

        }


        if (
            results.length === 0
        ) {

            return null;

        }


        /*
           Count repeated readings.

           If multiple OCR passes agree,
           that is much more reliable.
        */

        const counts = {};

        results.forEach(result => {

            counts[result.reading] =
                (counts[result.reading] || 0) + 1;

        });


        results.sort(
            (a, b) => {

                const countA =
                    counts[a.reading] || 0;

                const countB =
                    counts[b.reading] || 0;

                /*
                   First priority:
                   agreement between OCR passes.

                   Second priority:
                   confidence.
                */

                if (
                    countA !== countB
                ) {

                    return countB -
                           countA;

                }

                return b.confidence -
                       a.confidence;

            }
        );


        const best =
            results[0];


        console.log(
            "OCR candidates:",
            results
        );

        console.log(
            "SELECTED READING:",
            best.reading
        );


        return best;

    }


    /* =========================================================
       CAPTURE
    ========================================================= */

    async function captureReading() {

        if (!cameraActive) {

            showStatus(
                "⚠️ Camera is not active."
            );

            return;

        }

        if (isProcessing) {

            showStatus(
                "⏳ Please wait..."
            );

            return;

        }


        isProcessing = true;

        captureBtn.disabled = true;

        captureBtn.innerHTML =
            '<span class="spinner"></span> Reading...';


        try {

            /*
               Verify that video is ready.
            */

            if (
                video.readyState <
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                throw new Error(
                    "Camera image is not ready."
                );

            }


            showStatus(
                "🔍 Cropping LCD display...",
                false,
                true
            );


            const result =
                await performOCR();


            if (
                result &&
                result.reading
            ) {

                currentExtractedReading =
                    result.reading;

                currentOcrConfidence =
                    result.confidence;

                lastCaptureTime =
                    Date.now();


                showStatus(
                    `✅ Reading detected: ${result.reading} kWh`,
                    true
                );


                console.log(
                    "FINAL METER READING:",
                    result.reading
                );


            } else {

                currentExtractedReading =
                    null;

                currentOcrConfidence =
                    0;


                showStatus(
                    "⚠️ Could not confidently read the LCD. Move closer, keep the display straight and try again."
                );

            }

        } catch (error) {

            console.error(
                "Capture error:",
                error
            );

            showStatus(
                "❌ OCR error: " +
                error.message
            );

        } finally {

            isProcessing = false;

            captureBtn.disabled = false;

            captureBtn.innerHTML =
                "📸 Capture & Read";

            updateUI();

        }

    }


    /* =========================================================
       CONFIRM READING
    ========================================================= */

    function confirmReading() {

        if (
            !currentExtractedReading
        ) {

            showStatus(
                "⚠️ No reading to confirm."
            );

            return;

        }


        const feeder =
            feederSelect.value;

        const reading =
            currentExtractedReading;

        const time =
            new Date()
                .toLocaleTimeString();


        registeredEntries.push({

            feeder:
                feeder,

            reading:
                reading,

            time:
                time

        });


        currentExtractedReading =
            null;

        currentOcrConfidence =
            0;

        lastCaptureTime =
            null;


        showStatus(
            `✅ ${reading} kWh registered for ${feeder}`,
            true
        );


        updateUI();

    }


    /* =========================================================
       DISCARD
    ========================================================= */

    function discardReading() {

        if (
            currentExtractedReading
        ) {

            currentExtractedReading =
                null;

            currentOcrConfidence =
                0;

            lastCaptureTime =
                null;


            showStatus(
                "🗑️ Reading discarded"
            );

            updateUI();

        } else {

            showStatus(
                "ℹ️ No reading to discard"
            );

        }

    }


    /* =========================================================
       CLEAR
    ========================================================= */

    function clearEntries() {

        if (
            registeredEntries.length === 0
        ) {

            showStatus(
                "ℹ️ No entries to clear"
            );

            return;

        }


        if (
            confirm(
                "Clear all registered readings?"
            )
        ) {

            registeredEntries = [];

            showStatus(
                "🗑️ All readings cleared"
            );

            updateUI();

        }

    }


    /* =========================================================
       GOOGLE SHEETS
    ========================================================= */

    function submitToSheets() {

        if (
            registeredEntries.length === 0
        ) {

            showStatus(
                "⚠️ No readings to submit"
            );

            return;

        }


        const payload = {

            entries:
                registeredEntries.map(
                    entry => ({

                        feeder:
                            entry.feeder,

                        reading:
                            entry.reading,

                        unit:
                            "kWh",

                        timestamp:
                            entry.time,

                        date:
                            new Date()
                                .toISOString()
                                .split("T")[0]

                    })
                )

        };


        /*
           PUT YOUR ACTUAL GOOGLE APPS
           SCRIPT WEB APP URL HERE.
        */

        const SHEETS_WEBHOOK_URL =
            "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";


        console.log(
            "Google Sheets payload:",
            payload
        );


        /*
           If you have a real Apps Script
           endpoint, replace this demo section
           with fetch().
        */

        if (
            SHEETS_WEBHOOK_URL.includes(
                "YOUR_DEPLOYMENT_ID"
            )
        ) {

            showStatus(
                `✅ Demo: ${registeredEntries.length} reading(s) ready for Google Sheets`,
                true
            );

            return;

        }


        showStatus(
            "⏳ Submitting to Google Sheets..."
        );


        fetch(
            SHEETS_WEBHOOK_URL,
            {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(payload)

            }
        )
        .then(() => {

            showStatus(
                "✅ Readings submitted to Google Sheets",
                true
            );

        })
        .catch(error => {

            console.error(
                "Submission error:",
                error
            );

            showStatus(
                "❌ Could not submit readings."
            );

        });

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    captureBtn.addEventListener(
        "click",
        captureReading
    );


    toggleCameraBtn.addEventListener(
        "click",
        async function() {

            stopCamera();

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        300
                    )
            );

            startCamera();

        }
    );


    confirmBtn.addEventListener(
        "click",
        confirmReading
    );


    discardBtn.addEventListener(
        "click",
        discardReading
    );


    submitBtn.addEventListener(
        "click",
        submitToSheets
    );


    clearBtn.addEventListener(
        "click",
        clearEntries
    );


    feederSelect.addEventListener(
        "change",
        updateUI
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    startCamera();

    updateUI();


    /* =========================================================
       CLEANUP
    ========================================================= */

    window.addEventListener(
        "beforeunload",
        function() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }

        }
    );


})();

</script>
