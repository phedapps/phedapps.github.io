<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTR Information Search</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 24px 16px;
      background: #f2f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 24px 20px 32px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #eef2f7;
    }
    .logo-container {
      margin-bottom: 2px;
    }
    .logo-container img {
      width: 140px;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }
    .header-text {
      text-align: center;
    }
    .header-text h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0b1a33;
      margin: 0;
      line-height: 1.2;
    }
    .header-text .subtitle {
      font-size: 0.8rem;
      color: #4d627a;
      font-weight: 400;
    }
    .search-section {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input-wrapper {
      position: relative;
    }
    #searchInput {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid #d9e0eb;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%237a8ba8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');
      background-repeat: no-repeat;
      background-position: 14px center;
      background-size: 20px;
    }
    #searchInput:focus {
      border-color: #1a6bff;
      box-shadow: 0 0 0 3px rgba(26,107,255,0.15);
      background-color: white;
    }
    #searchInput::placeholder {
      color: #a0b0c8;
    }
    #searchInput:disabled {
      background-color: #f2f5f9;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .search-input-wrapper.loading #searchInput {
      padding-right: 50px;
      border-color: #1a6bff;
      background-image: none;
      background-color: #f8faff;
    }
    .search-input-wrapper.loading #searchInput::placeholder {
      color: #1a6bff;
    }
    .search-loading {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      align-items: center;
      gap: 8px;
    }
    .search-input-wrapper.loading .search-loading {
      display: flex;
    }
    .search-loading .spinner-small {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid #eef2f7;
      border-radius: 50%;
      border-top-color: #1a6bff;
      animation: spin 0.7s linear infinite;
    }
    .search-loading .loading-text {
      font-size: 0.8rem;
      color: #1a6bff;
      font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: white;
      border: 1px solid #d0d8e3;
      border-radius: 14px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      display: none;
      padding: 4px 0;
    }
    .suggestions-box::-webkit-scrollbar {
      width: 6px;
    }
    .suggestions-box::-webkit-scrollbar-track {
      background: #f2f5f9;
      border-radius: 8px;
    }
    .suggestions-box::-webkit-scrollbar-thumb {
      background: #d0d8e3;
      border-radius: 8px;
    }
    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f4fc;
      font-size: 0.95rem;
      transition: 0.1s;
    }
    .suggestion-item:last-child {
      border-bottom: none;
    }
    .suggestion-item:hover {
      background: #f0f7ff;
    }
    .suggestion-item .suggestion-main {
      font-weight: 600;
      color: #0b1a33;
    }
    .suggestion-item .suggestion-sub {
      font-size: 0.78rem;
      color: #4a5c7a;
      margin-left: 8px;
      font-weight: 500;
    }
    .suggestion-item .suggestion-detail {
      font-size: 0.75rem;
      color: #7a8ba8;
      margin-top: 2px;
    }
    .suggestion-item .highlight {
      background: #e8f0fe;
      padding: 0 2px;
      border-radius: 2px;
    }
    .no-suggestions {
      padding: 16px;
      text-align: center;
      color: #7a8ba8;
      font-size: 0.9rem;
    }
    .results-container {
      margin-top: 4px;
    }
    .welcome-message {
      text-align: center;
      padding: 40px 20px;
      color: #7a8ba8;
    }
    .welcome-message .icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    .welcome-message h3 {
      font-size: 1.1rem;
      color: #0b1a33;
      margin-bottom: 4px;
    }
    .welcome-message p {
      font-size: 0.9rem;
    }
    .welcome-message.hidden {
      display: none;
    }
    .detail-card {
      background: #f8faff;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #eef2f7;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .detail-card .dtr-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #eef2f7;
    }
    .detail-card .dtr-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0b1a33;
    }
    .detail-card .dtr-id {
      font-size: 0.85rem;
      color: #3b6cb7;
      font-weight: 600;
      background: #e8f0fe;
      padding: 2px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    .detail-card .detail-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      padding: 8px 0;
      font-size: 0.9rem;
      color: #1f2a44;
      border-bottom: 1px solid #f0f4fc;
    }
    .detail-card .detail-row:last-of-type {
      border-bottom: none;
    }
    .detail-card .detail-row .label {
      color: #7a8ba8;
      font-weight: 500;
      min-width: 80px;
    }
    .detail-card .detail-row .value {
      font-weight: 500;
      flex: 1;
    }
    .detail-card .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 20px;
    }
    .badge-region {
      background: #d1ecf1;
      color: #0c5460;
    }
    .badge-network {
      background: #cce5ff;
      color: #004085;
    }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      color: #7a8ba8;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-left: auto;
    }
    .copy-btn:hover {
      background: #e8f0fe;
      color: #1a6bff;
    }
    .copy-btn:active {
      transform: scale(0.9);
    }
    .copy-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .copy-btn.copied {
      color: #28a745;
    }
    .copy-btn.copied svg {
      stroke: #28a745;
    }
    .copy-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0b1a33;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 999;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .copy-hint {
      font-size: 0.7rem;
      color: #7a8ba8;
      text-align: center;
      margin-top: 8px;
      opacity: 0.7;
    }
    .footer {
      text-align: center;
      padding: 16px 20px;
      color: #7a8ba8;
      font-size: 0.8rem;
      font-weight: 400;
      border-top: 1px solid #eef2f7;
      margin-top: 8px;
    }
    .footer .designer {
      color: #1a6bff;
      font-weight: 600;
    }
    @media (max-width: 480px) {
      .detail-card .dtr-header {
        flex-direction: column;
        gap: 6px;
      }
      .detail-card .detail-row {
        flex-wrap: wrap;
        gap: 4px 8px;
        padding: 6px 0;
      }
      .detail-card .detail-row .label {
        min-width: 65px;
        font-size: 0.8rem;
      }
      .detail-card .detail-row .value {
        font-size: 0.85rem;
      }
      .copy-btn {
        padding: 2px 4px;
        margin-left: auto;
      }
      .copy-btn span {
        display: none;
      }
      .copy-btn svg {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo-container">
      <img src="PHED logo.png" alt="PHED Logo" onerror="this.style.display='none'">
    </div>
    <div class="header-text">
      <h2>Calabar Region</h2>
      <div class="subtitle">DTR Information Search</div>
    </div>
  </div>

  <div class="search-section">
    <div class="search-input-wrapper" id="searchWrapper">
      <input type="text" id="searchInput" placeholder="Loading transformer data..." disabled>
      <div class="search-loading">
        <span class="spinner-small"></span>
        <span class="loading-text">Loading...</span>
      </div>
      <div id="suggestions" class="suggestions-box"></div>
    </div>
  </div>

  <div class="results-container" id="resultsContainer">
    <div class="welcome-message" id="welcomeMessage">
      <div class="icon">🔌</div>
      <h3>Search for Transformers</h3>
      <p>Start typing to find DTR information</p>
    </div>
    <div id="detailView" style="display:none;"></div>
    <div class="copy-hint" id="copyHint" style="display:none;">📋 Click the copy icon next to any value to copy it</div>
  </div>

  <div class="footer">
    Designed by <span class="designer">Obot Akpan</span>
  </div>
</div>

<div id="copyToast" class="copy-toast">📋 Copied to clipboard!</div>

<script>
  // ============================================================
  // CONFIG – your Google Apps Script web app URL
  // ============================================================
  const searchDataURL = "https://script.google.com/macros/s/AKfycbwUaCqFSNSMnjUiuUE65EPL75CFnAOTGXLx8olkakjb620S2s2izxLNlNlAwOOPaVwn/exec";

  // ============================================================
  // DOM REFS
  // ============================================================
  const searchWrapper = document.getElementById('searchWrapper');
  const searchInput = document.getElementById('searchInput');
  const suggestionsBox = document.getElementById('suggestions');
  const welcomeMessage = document.getElementById('welcomeMessage');
  const detailView = document.getElementById('detailView');
  const copyHint = document.getElementById('copyHint');
  const copyToast = document.getElementById('copyToast');

  // ============================================================
  // STATE
  // ============================================================
  let transformers = [];
  let isDataLoaded = false;
  let selectedTransformer = null;
  let toastTimeout = null;

  // ============================================================
  // COPY TO CLIPBOARD
  // ============================================================
  function copyToClipboard(text, buttonElement) {
    const copyFn = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('📋 Copied: "' + text + '"');
          if (buttonElement) {
            buttonElement.classList.add('copied');
            setTimeout(() => buttonElement.classList.remove('copied'), 1500);
          }
        }).catch(() => {
          fallbackCopy(text, buttonElement);
        });
      } else {
        fallbackCopy(text, buttonElement);
      }
    };
    copyFn();
  }

  function fallbackCopy(text, buttonElement) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    textarea.style.left = '-9999px';
    textarea.style.top = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      const successful = document.execCommand('copy');
      if (successful) {
        showToast('📋 Copied: "' + text + '"');
        if (buttonElement) {
          buttonElement.classList.add('copied');
          setTimeout(() => buttonElement.classList.remove('copied'), 1500);
        }
      } else {
        showToast('⚠️ Could not copy. Please select and copy manually.');
      }
    } catch (err) {
      showToast('⚠️ Could not copy. Please select and copy manually.');
    }
    document.body.removeChild(textarea);
  }

  function showToast(message) {
    copyToast.textContent = message;
    copyToast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      copyToast.classList.remove('show');
    }, 2000);
  }

  // ============================================================
  // SVG COPY ICON
  // ============================================================
  function getCopyIcon() {
    return `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  }

  // ============================================================
  // LOAD DATA
  // ============================================================
  function loadTransformerData() {
    searchWrapper.classList.add('loading');
    searchInput.disabled = true;
    searchInput.placeholder = 'Loading transformer data...';
    welcomeMessage.classList.remove('hidden');
    detailView.style.display = 'none';
    copyHint.style.display = 'none';

    fetch(searchDataURL)
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok: ' + res.status);
        return res.json();
      })
      .then(data => {
        console.log('Raw data:', data);
        
        let rawArray = null;
        if (Array.isArray(data)) {
          rawArray = data;
        } else if (data && typeof data === 'object') {
          if (Array.isArray(data.results)) rawArray = data.results;
          else if (Array.isArray(data.data)) rawArray = data.data;
          else if (Array.isArray(data.rows)) rawArray = data.rows;
          else if (Array.isArray(data.values)) rawArray = data.values;
          else {
            const keys = Object.keys(data);
            for (const key of keys) {
              if (Array.isArray(data[key]) && data[key].length > 0) {
                rawArray = data[key];
                break;
              }
            }
          }
        }

        if (!rawArray || !rawArray.length) {
          if (data && typeof data === 'object') {
            const values = Object.values(data);
            if (values.length && Array.isArray(values[0])) {
              rawArray = values;
            } else if (values.length && typeof values[0] === 'object') {
              rawArray = values;
            }
          }
        }

        if (Array.isArray(rawArray) && rawArray.length > 0) {
          const firstRow = rawArray[0];
          const isHeaderRow = Array.isArray(firstRow) && 
            firstRow.some(val => typeof val === 'string' && 
              ['Region', 'Network', 'FeederID', 'FeederName', 'DTRID', 'DTR_Name'].includes(val.trim()));
          
          let dataRows = rawArray;
          if (isHeaderRow) {
            dataRows = rawArray.slice(1);
          }

          transformers = dataRows.map(row => {
            if (Array.isArray(row)) {
              return {
                region: String(row[0] || '').trim(),
                network: String(row[1] || '').trim(),
                feederId: String(row[2] || '').trim(),
                feederName: String(row[3] || '').trim(),
                dtrId: String(row[4] || '').trim(),
                dtrName: String(row[5] || '').trim()
              };
            } else if (row && typeof row === 'object') {
              return {
                region: String(row.Region || row.region || row[0] || '').trim(),
                network: String(row.Network || row.network || row[1] || '').trim(),
                feederId: String(row.FeederID || row.feederId || row.FeederId || row[2] || '').trim(),
                feederName: String(row.FeederName || row.feederName || row.Feeder || row.feeder || row[3] || '').trim(),
                dtrId: String(row.DTRID || row.dtrId || row.DTR_ID || row[4] || '').trim(),
                dtrName: String(row.DTR_Name || row.dtrName || row.DTRNAME || row.DTR_NAME || row[5] || '').trim()
              };
            }
            return null;
          }).filter(item => item && item.dtrName && item.dtrName !== '');
        }

        if (transformers.length === 0 && Array.isArray(rawArray) && rawArray.length > 0) {
          transformers = rawArray.map(row => {
            if (Array.isArray(row)) {
              return {
                region: String(row[0] || '').trim(),
                network: String(row[1] || '').trim(),
                feederId: String(row[2] || '').trim(),
                feederName: String(row[3] || '').trim(),
                dtrId: String(row[4] || '').trim(),
                dtrName: String(row[5] || '').trim()
              };
            }
            return null;
          }).filter(item => item && (item.dtrName || item.dtrId));
        }

        isDataLoaded = true;
        searchWrapper.classList.remove('loading');
        searchInput.disabled = false;
        searchInput.placeholder = 'Search by name, ID, feeder...';
        console.log(`✅ Loaded ${transformers.length} transformer records`);
        
        if (transformers.length === 0) {
          welcomeMessage.innerHTML = `
            <div class="icon">⚠️</div>
            <h3>No Data Found</h3>
            <p>No transformer records were found in the data.</p>
          `;
        } else {
          welcomeMessage.classList.remove('hidden');
          if (searchInput.value.trim()) {
            performSearch(searchInput.value.trim());
          }
        }
      })
      .catch(err => {
        console.error("Load error:", err);
        searchWrapper.classList.remove('loading');
        searchInput.disabled = false;
        searchInput.placeholder = 'Error loading data – refresh page';
        welcomeMessage.classList.remove('hidden');
        welcomeMessage.innerHTML = `
          <div class="icon">⚠️</div>
          <h3>Error Loading Data</h3>
          <p>${err.message || 'Could not load transformer data. Please refresh.'}</p>
        `;
      });
  }

  // ============================================================
  // SEARCH / SUGGESTIONS
  // ============================================================
  function performSearch(keyword) {
    if (!isDataLoaded || !keyword || keyword.length < 1) {
      suggestionsBox.style.display = 'none';
      return;
    }

    if (transformers.length === 0) {
      suggestionsBox.innerHTML = `<div class="no-suggestions">No data available. Please refresh.</div>`;
      suggestionsBox.style.display = 'block';
      return;
    }

    const searchTerm = keyword.toLowerCase().trim();
    const matches = transformers.filter(item => {
      const name = (item.dtrName || '').toLowerCase();
      const id = (item.dtrId || '').toLowerCase();
      const feeder = (item.feederName || '').toLowerCase();
      const region = (item.region || '').toLowerCase();
      const network = (item.network || '').toLowerCase();
      const feederId = (item.feederId || '').toLowerCase();
      return name.includes(searchTerm) || id.includes(searchTerm) ||
             feeder.includes(searchTerm) || region.includes(searchTerm) ||
             network.includes(searchTerm) || feederId.includes(searchTerm);
    });

    displaySuggestions(matches, searchTerm);
  }

  // ============================================================
  // DISPLAY SUGGESTIONS
  // ============================================================
  function displaySuggestions(matches, searchTerm) {
    suggestionsBox.innerHTML = '';
    if (matches.length === 0) {
      suggestionsBox.innerHTML = `<div class="no-suggestions">No transformers found</div>`;
      suggestionsBox.style.display = 'block';
      return;
    }

    matches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';

      const name = item.dtrName || 'Unnamed';
      const id = item.dtrId || 'No ID';
      const feeder = item.feederName || 'N/A';
      const region = item.region || 'N/A';
      const network = item.network || 'N/A';

      const highlightedName = highlightText(String(name), searchTerm);
      const highlightedId = highlightText(String(id), searchTerm);

      div.innerHTML = `
        <div>
          <span class="suggestion-main">${highlightedName}</span>
          <span class="suggestion-sub">${highlightedId}</span>
        </div>
        <div class="suggestion-detail">
          ${region} • ${network} • Feeder: ${feeder}
        </div>
      `;
      div.addEventListener('click', () => selectTransformer(item));
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.style.display = 'block';
  }

  // ============================================================
  // HIGHLIGHT
  // ============================================================
  function highlightText(text, searchTerm) {
    if (!text) return 'N/A';
    const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
  }

  // ============================================================
  // SELECT TRANSFORMER – show full details with individual copy buttons
  // ============================================================
  function selectTransformer(item) {
    selectedTransformer = item;
    suggestionsBox.style.display = 'none';

    const name = item.dtrName || 'Unnamed';
    const id = item.dtrId || 'No ID';
    const feeder = item.feederName || 'N/A';
    const feederId = item.feederId || 'N/A';
    const region = item.region || 'N/A';
    const network = item.network || 'N/A';

    searchInput.value = name;
    welcomeMessage.classList.add('hidden');
    detailView.style.display = 'block';
    copyHint.style.display = 'block';

    // Helper to create a copy button
    function createCopyButton(value, label) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = getCopyIcon() + `<span>Copy</span>`;
      btn.title = `Copy ${label}`;
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        copyToClipboard(value, this);
      });
      return btn;
    }

    // Build the detail card with individual copy buttons
    const card = document.createElement('div');
    card.className = 'detail-card';

    // Header
    const header = document.createElement('div');
    header.className = 'dtr-header';
    header.innerHTML = `
      <div>
        <div class="dtr-name">${name}</div>
        <span class="dtr-id">${id}</span>
      </div>
      <div>
        <span class="badge badge-region">${region}</span>
        <span class="badge badge-network" style="margin-left:4px;">${network}</span>
      </div>
    `;
    card.appendChild(header);

    // Row: DTR Name
    const nameRow = document.createElement('div');
    nameRow.className = 'detail-row';
    const nameLabel = document.createElement('span');
    nameLabel.className = 'label';
    nameLabel.textContent = '📌 DTR Name:';
    const nameValue = document.createElement('span');
    nameValue.className = 'value';
    nameValue.textContent = name;
    nameRow.appendChild(nameLabel);
    nameRow.appendChild(nameValue);
    nameRow.appendChild(createCopyButton(name, 'DTR Name'));
    card.appendChild(nameRow);

    // Row: DTR ID
    const idRow = document.createElement('div');
    idRow.className = 'detail-row';
    const idLabel = document.createElement('span');
    idLabel.className = 'label';
    idLabel.textContent = '🏷️ DTR ID:';
    const idValue = document.createElement('span');
    idValue.className = 'value';
    idValue.textContent = id;
    idRow.appendChild(idLabel);
    idRow.appendChild(idValue);
    idRow.appendChild(createCopyButton(id, 'DTR ID'));
    card.appendChild(idRow);

    // Row: Feeder
    const feederRow = document.createElement('div');
    feederRow.className = 'detail-row';
    const feederLabel = document.createElement('span');
    feederLabel.className = 'label';
    feederLabel.textContent = '📍 Feeder:';
    const feederValue = document.createElement('span');
    feederValue.className = 'value';
    feederValue.textContent = feeder;
    feederRow.appendChild(feederLabel);
    feederRow.appendChild(feederValue);
    feederRow.appendChild(createCopyButton(feeder, 'Feeder'));
    card.appendChild(feederRow);

    // Row: Feeder ID
    const feederIdRow = document.createElement('div');
    feederIdRow.className = 'detail-row';
    const feederIdLabel = document.createElement('span');
    feederIdLabel.className = 'label';
    feederIdLabel.textContent = '🔢 Feeder ID:';
    const feederIdValue = document.createElement('span');
    feederIdValue.className = 'value';
    feederIdValue.textContent = feederId;
    feederIdRow.appendChild(feederIdLabel);
    feederIdRow.appendChild(feederIdValue);
    feederIdRow.appendChild(createCopyButton(feederId, 'Feeder ID'));
    card.appendChild(feederIdRow);

    // Row: Network
    const networkRow = document.createElement('div');
    networkRow.className = 'detail-row';
    const networkLabel = document.createElement('span');
    networkLabel.className = 'label';
    networkLabel.textContent = '🏛️ Network:';
    const networkValue = document.createElement('span');
    networkValue.className = 'value';
    networkValue.textContent = network;
    networkRow.appendChild(networkLabel);
    networkRow.appendChild(networkValue);
    networkRow.appendChild(createCopyButton(network, 'Network'));
    card.appendChild(networkRow);

    // Row: Region
    const regionRow = document.createElement('div');
    regionRow.className = 'detail-row';
    const regionLabel = document.createElement('span');
    regionLabel.className = 'label';
    regionLabel.textContent = '📌 Region:';
    const regionValue = document.createElement('span');
    regionValue.className = 'value';
    regionValue.textContent = region;
    regionRow.appendChild(regionLabel);
    regionRow.appendChild(regionValue);
    regionRow.appendChild(createCopyButton(region, 'Region'));
    card.appendChild(regionRow);

    detailView.innerHTML = '';
    detailView.appendChild(card);
    detailView.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  let searchTimeout;
  searchInput.addEventListener('input', function() {
    if (!isDataLoaded) return;
    clearTimeout(searchTimeout);
    const keyword = this.value.trim();
    if (!keyword) {
      suggestionsBox.style.display = 'none';
      return;
    }
    searchTimeout = setTimeout(() => performSearch(keyword), 300);
  });

  searchInput.addEventListener('focus', function() {
    if (this.value.trim() && isDataLoaded) performSearch(this.value.trim());
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-section')) suggestionsBox.style.display = 'none';
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = suggestionsBox.querySelector('.suggestion-item');
      if (first) first.click();
    }
    if (e.key === 'Escape') {
      suggestionsBox.style.display = 'none';
      this.blur();
    }
  });

  // ============================================================
  // INIT
  // ============================================================
  loadTransformerData();
  console.log('🔍 DTR Search (Calabar Region) loaded');
  console.log('📋 Click the copy icon next to any value to copy it individually');
</script>
</body>
</html>
