<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOR Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f9f9f7; padding: 20px; }
    h1 { color: #333; margin: 20px 0; }
    .step { padding: 20px; border: 1px solid #ddd; border-radius: 10px; background: white; margin-bottom: 20px; }
    .step-indicator { display: flex; gap: 10px; margin-bottom: 20px; }
    .indicator { flex: 1; text-align: center; padding: 8px; border-radius: 8px; background: #ddd; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .indicator:hover { background: #bbb; }
    .indicator.active { background: #007BFF; color: white; }
    #result { margin-top: 20px; font-size: 16px; font-weight: bold; color: #007BFF; }
    .data-source { font-size: 12px; color: #999; margin-top: 5px; }
    .spinner { 
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007BFF;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .filter-status { font-size: 14px; padding: 8px; margin-top: 10px; border-radius: 5px; }
    .filter-status.success { background: #d4edda; color: #155724; }
    .filter-status.error { background: #f8d7da; color: #721c24; }
    .filter-status.info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body class="container">
  
<div style="text-align: center;">
  <img src="PHED logo.png" alt="PHED" 
       style="width: 300px; height: auto; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto;" 
       onerror="this.style.display='none'">
  <h1>LOR CALCULATOR</h1>
  <div id="dataStatus" class="data-source">Loading data from Google Sheets...</div>
  <div id="loadingSpinner" class="spinner"></div>
</div>

<!-- Step indicator -->
<div class="step-indicator">
  <div class="indicator active" id="ind1" onclick="showStep('step1', 1)">Step 1</div>
  <div class="indicator" id="ind2" onclick="showStep('step2', 2)">Step 2</div>
  <div class="indicator" id="ind3" onclick="showStep('step3', 3)">Step 3</div>
  <div class="indicator" id="ind4" onclick="showStep('step4', 4)">Result</div>
</div>

<!-- Step 1 -->
<div class="step" id="step1">
  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4">
      <label class="form-label">Region</label>
      <select id="region" class="form-control" required>
        <option value="" disabled selected>Select Region *</option>
      </select>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <label class="form-label">Voltage Level</label>
      <select id="voltage" class="form-control" required>
        <option value="" disabled selected>Select Voltage Level *</option>
      </select>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <label class="form-label">Feeder</label>
      <select id="feeder" class="form-control" required>
        <option value="" disabled selected>Select a Feeder *</option>
      </select>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <label class="form-label">Band</label>
      <select id="band" class="form-control" required>
        <option value="" disabled selected>Select a Band *</option>
        <option value="209.5">Band A-Non MD</option>
        <option value="209.5">Band A-MD1</option>
        <option value="209.5">Band A-MD2</option>
        <option value="68.96">Band B-Non MD</option>
        <option value="67.18">Band B-MD1</option>
        <option value="67.12">Band B-MD2</option>
        <option value="56.38">Band C-Non MD</option>
        <option value="54.64">Band C-MD1</option>
        <option value="54.64">Band C-MD2</option>
        <option value="39.67">Band D-Non MD</option>
        <option value="55.43">Band D-MD1</option>
        <option value="55.43">Band D-MD2</option>
        <option value="39.44">Band E-Non MD</option>
        <option value="55.43">Band E-MD1</option>
        <option value="55.43">Band E-MD2</option>
      </select>
    </div>

    <div class="col-12">
      <div id="feederInfo" class="text-center mt-3"></div>
    </div>
  </div>
  
  <div id="filterStatus" class="filter-status info mt-3">Select Region and Voltage to see available feeders</div>
  
  <div class="d-flex justify-content-end mt-3">
    <button class="btn btn-primary" id="next1">Next ➡️</button>
  </div>
</div>

<!-- Step 2 -->
<div class="step" id="step2" style="display:none;">
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label">HT Lines (span)</label>
      <input id="B5" type="text" class="form-control">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">HT/LT Lines (span)</label>
      <input id="C5" type="text" class="form-control">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">LT Lines (span)</label>
      <input id="D5" type="text" class="form-control">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">Peak Load (MW)</label>
      <input id="E5" type="number" class="form-control" value="0" step="0.1">
    </div>
  </div>
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" id="back2">⬅️ Back</button>
    <button class="btn btn-primary" id="next2">Next ➡️</button>
  </div>
</div>

<!-- Step 3 -->
<div class="step" id="step3" style="display:none;">
  <div class="row g-3">
    <div class="col-12 col-md-6">
      <label class="form-label">Time to take outage and Isolate the line (hr)</label>
      <input id="E8" type="number" class="form-control" value="1">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">Total number of days to do the work</label>
      <input id="E15" type="number" class="form-control" value="1">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">Time to do the work (hr)</label>
      <input id="E16" type="number" class="form-control" value="0">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">Total Number of DTRs on the feeder</label>
      <input id="E17" type="number" class="form-control" value="1">
    </div>
    <div class="col-12 col-md-6">
      <label class="form-label">Total number of DTRs Affected</label>
      <input id="E18" type="number" class="form-control" value="0">
    </div>
  </div>
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" id="back3">⬅️ Back</button>
    <button class="btn btn-success" id="finish">✅ Finish</button>
  </div>
</div>

<!-- Step 4 -->
<div class="step" id="step4" style="display:none;">
  <div id="result" class="mt-4"></div>
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" id="back4">⬅️ Back</button>
  </div>
</div>

<script>
  // ============================================
  // CONFIGURATION - UPDATE THIS WITH YOUR URL
  // ============================================
  const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbwaHSxVwHh_vYvlxlj6shc2o2fW_2LoIfPBEoLHM3iBGJ18ewThZSf1EdMc7HhyeVQ/exec';
  
  // ============================================
  // APPLICATION CODE - ALL DATA FROM GOOGLE SHEETS
  // ============================================
  let feederData = [];
  let dataLoaded = false;
  
  // Fetch data from Google Sheets
  async function loadData() {
    try {
      document.getElementById('dataStatus').textContent = 'Loading data from Google Sheets...';
      document.getElementById('loadingSpinner').style.display = 'block';
      
      const response = await fetch(GOOGLE_SHEETS_API_URL);
      if (!response.ok) throw new Error('Network response was not ok');
      
      const data = await response.json();
      feederData = data.feeders || [];
      
      dataLoaded = true;

      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('dataStatus').textContent = `✅ Data loaded: ${feederData.length} feeders from Google Sheets`;
      document.getElementById('dataStatus').style.color = '#28a745';
      
      populateFilters();
      return data;
    } catch (error) {
      console.error('Error loading data:', error);
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('dataStatus').textContent = '❌ Failed to load data from Google Sheets. Please check the API URL.';
      document.getElementById('dataStatus').style.color = '#dc3545';
      return [];
    }
  }
  
  function populateFilters() {
    const regionSelect = document.getElementById('region');
    const voltageSelect = document.getElementById('voltage');
    
    regionSelect.innerHTML = '<option value="" disabled selected>Select Region *</option>';
    voltageSelect.innerHTML = '<option value="" disabled selected>Select Voltage Level *</option>';
    
    // Get unique regions from Google Sheets data
    const regions = [...new Set(feederData.map(f => f.region))].filter(Boolean);
    
    // Get unique voltages from Google Sheets data
    const voltages = [...new Set(feederData.map(f => f.voltage))].filter(Boolean);
    
    // Populate regions
    regions.sort();
    regions.forEach(region => {
      const option = document.createElement('option');
      option.value = region;
      option.textContent = region;
      regionSelect.appendChild(option);
    });
    
    // Populate voltages
    voltages.sort();
    voltages.forEach(voltage => {
      const option = document.createElement('option');
      option.value = voltage;
      option.textContent = voltage + 'KV';
      voltageSelect.appendChild(option);
    });
  }
  
  function updateFeeders() {
    const region = document.getElementById('region').value;
    const voltage = document.getElementById('voltage').value;
    const feederSelect = document.getElementById('feeder');
    const filterStatus = document.getElementById('filterStatus');
    
    // Clear the feeder dropdown
    feederSelect.innerHTML = '<option value="" disabled selected>Select a Feeder *</option>';
    document.getElementById('feederInfo').innerHTML = '';
    
    if (region && voltage) {
      // Filter feeders by BOTH region AND voltage from Google Sheets data
      const filtered = feederData.filter(f => 
        f.region === region && 
        f.voltage === voltage && 
        f.status === 'ACTIVE'
      );
      
      // Sort feeders alphabetically
      filtered.sort((a, b) => a.feeder.localeCompare(b.feeder));
      
      // Add each feeder to the dropdown
      filtered.forEach(f => {
        const option = document.createElement('option');
        option.value = f.feeder;
        option.textContent = f.feeder;
        option.dataset.maxLoad = f.maxLoad;
        option.dataset.avgLoad = f.avgLoad;
        feederSelect.appendChild(option);
      });
      
      // Update filter status
      if (filtered.length > 0) {
        filterStatus.className = 'filter-status success';
        filterStatus.innerHTML = `✅ Found <strong>${filtered.length}</strong> feeder(s) for <strong>${region}</strong> - <strong>${voltage}KV</strong>`;
      } else {
        filterStatus.className = 'filter-status error';
        filterStatus.innerHTML = `❌ No active ${voltage}KV feeders found in ${region}`;
      }
    } else {
      filterStatus.className = 'filter-status info';
      filterStatus.innerHTML = 'Select Region and Voltage to see available feeders';
    }
  }
  
  function updateFeederInfo() {
    const feeder = document.getElementById('feeder').value;
    const voltage = document.getElementById('voltage').value;
    const region = document.getElementById('region').value;
    const feederInfoDiv = document.getElementById('feederInfo');
    const bandSelect = document.getElementById('band');
    const bandOption = bandSelect.options[bandSelect.selectedIndex];
    const bandName = bandOption ? bandOption.text : "";
    const bandValue = bandOption ? bandOption.value : "";
    
    if (feeder && bandName) {
      const data = feederData.find(f => f.feeder === feeder);
      if (data) {
        feederInfoDiv.innerHTML = 
          `🟢 <b>${feeder} ${voltage}KV Feeder</b><br>
           • Region: ${data.region}<br>
           • ${bandName} — ₦${bandValue}/kwh<br>
           • Maximum Load: ${data.maxLoad} MW<br>
           • Average Load: ${data.avgLoad} MW`;
        
        document.getElementById("E5").value = data.maxLoad || 0;
      }
    } else {
      feederInfoDiv.innerHTML = "";
    }
  }
  
  function showStep(stepId, stepIndex) {
    if (stepIndex > 1 && (!document.getElementById('region').value || 
        !document.getElementById('voltage').value || 
        !document.getElementById('feeder').value || 
        !document.getElementById('band').value)) {
      alert("Please complete all required fields!");
      return;
    }
    
    document.querySelectorAll(".step").forEach(step => step.style.display = "none");
    document.getElementById(stepId).style.display = "block";
    document.querySelectorAll(".indicator").forEach(ind => ind.classList.remove("active"));
    document.getElementById("ind" + stepIndex).classList.add("active");
  }
  
  function calculateLOR() {
    const region = document.getElementById('region').value;
    const feeder = document.getElementById('feeder').value;
    const voltage = document.getElementById('voltage').value;
    
    const bandSelect = document.getElementById('band');
    const bandOption = bandSelect.options[bandSelect.selectedIndex];
    const bandName = bandOption ? bandOption.text : "";
    const tariff = parseFloat(bandOption ? bandOption.value : 0);
    
    const peakLoad = parseFloat(document.getElementById('E5').value) || 0;
    const timeWork = parseFloat(document.getElementById('E16').value) || 0;
    const timePermit = parseFloat(document.getElementById('E8').value) || 0;
    const totalDays = parseFloat(document.getElementById('E15').value) || 0;
    const totalDTRs = parseFloat(document.getElementById('E17').value) || 1;
    const affectedDTRs = parseFloat(document.getElementById('E18').value) || 0;
    
    const part1 = (peakLoad * 1000) * timePermit * tariff * 1.075;
    const part2 = (affectedDTRs / totalDTRs) * (peakLoad * 1000) * timeWork * totalDays * tariff * 1.075;
    const fixedCost = 40000;
    const sectionATotal = part1 + part2 + fixedCost;
    
    document.getElementById('result').innerHTML = `
      <div id="resultCard" class="card shadow-sm" style="background:lightgray">
        <div class="card-body">
          <h3 class="card-title mb-3">📋 LOR Summary</h3>
          <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
              <tbody>
                <tr><th>Region</th><td>${region}</td></tr>
                <tr><th>Feeder</th><td>${feeder}</td></tr>
                <tr><th>Voltage Level</th><td>${voltage}KV</td></tr>
                <tr><th>Tariff</th><td>${bandName} (₦${tariff})</td></tr>
                <tr><th>Time to do the work (hr)</th><td>${timeWork}</td></tr>
                <tr><th>Total number of days</th><td>${totalDays}</td></tr>
                <tr><th>Total Number of DTRs</th><td>${totalDTRs}</td></tr>
                <tr><th>DTRs Affected</th><td>${affectedDTRs}</td></tr>
                <tr><th>Time for permit and Isolation (hr)</th><td>${timePermit}</td></tr>
              </tbody>
            </table>
          </div>
          
          <h3 class="mt-4">💰 LOR Breakdown</h3>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between">
              <span>Part 1</span>
              <span>₦${part1.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Part 2</span>
              <span>₦${part2.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Part 3 (Fixed Cost)</span>
              <span>₦${fixedCost.toLocaleString()}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between fw-bold list-group-item-success">
              <span>Total</span>
              <span>₦${sectionATotal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            </li>
          </ul>
          
          <div class="d-flex justify-content-center mt-3">
            <button id="exportPDF" class="btn btn-danger no-export">
              📄 Export to PDF
            </button>
          </div>
        </div>
      </div>
    `;
    
    document.getElementById('exportPDF').addEventListener('click', () => {
      const element = document.getElementById('resultCard');
      const opt = {
        margin: 10,
        filename: `LOR_Calculation_${region}_${feeder}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, ignoreElements: (el) => el.classList.contains('no-export') },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    });
    
    showStep('step4', 4);
  }
  
  // ============================================
  // INITIALIZATION
  // ============================================
  document.addEventListener('DOMContentLoaded', async function() {
    // Load data from Google Sheets
    await loadData();
    
    // Set up event listeners
    document.getElementById('region').addEventListener('change', updateFeeders);
    document.getElementById('voltage').addEventListener('change', updateFeeders);
    document.getElementById('feeder').addEventListener('change', updateFeederInfo);
    document.getElementById('band').addEventListener('change', updateFeederInfo);
    
    // Navigation buttons
    document.getElementById('next1').onclick = () => {
      if (!document.getElementById('region').value || 
          !document.getElementById('voltage').value || 
          !document.getElementById('feeder').value || 
          !document.getElementById('band').value) {
        alert("Please complete all required fields!");
        return;
      }
      showStep("step2", 2);
    };
    
    document.getElementById('back2').onclick = () => showStep("step1", 1);
    document.getElementById('next2').onclick = () => showStep("step3", 3);
    document.getElementById('back3').onclick = () => showStep("step2", 2);
    document.getElementById('back4').onclick = () => showStep("step3", 3);
    document.getElementById('finish').onclick = calculateLOR;
    
    // Initial update
    updateFeeders();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
</body>
</html>
