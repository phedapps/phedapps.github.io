<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformer Data Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 24px 16px;
      background: #f2f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 24px 20px 32px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      font-weight: 600;
      font-size: 1.7rem;
      letter-spacing: -0.3px;
      color: #0b1a33;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h2 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #3b6cb7;
      background: #e8f0fe;
      padding: 0 12px;
      border-radius: 40px;
      line-height: 1.6;
    }
    .input-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #2c3e66;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .input-group:focus-within label {
      color: #1a6bff;
    }
    input, select, .btn-link {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid #d9e0eb;
      background: #fbfdff;
      font-size: 0.95rem;
      transition: 0.2s;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #1a6bff;
      box-shadow: 0 0 0 3px rgba(26,107,255,0.15);
      background: white;
    }
    input[readonly] {
      background: #eef2f7;
      border-color: #d0d8e3;
      cursor: default;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #eef2f7;
      color: #1f2a44;
      text-decoration: none;
      font-weight: 600;
      border: none;
      padding: 12px;
      border-radius: 40px;
      transition: 0.15s;
      margin-top: 6px;
    }
    .btn-link:hover {
      background: #dce3ef;
      color: #0b1a33;
    }
    button, .search-btn {
      background: #1a6bff;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 18px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    button:hover:not(:disabled), .search-btn:hover {
      background: #0d4fc7;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    /* ----- GREEN SEARCH BAR ----- */
    #transformerSearch {
      border: 2px solid #2d8f4a;
      background: #f6fcf8;
      padding-left: 40px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%232d8f4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');
      background-repeat: no-repeat;
      background-position: 14px center;
      background-size: 18px;
    }
    #transformerSearch:focus {
      border-color: #1a6bff;
      box-shadow: 0 0 0 4px rgba(45, 143, 74, 0.25);
      background-color: white;
    }
    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: white;
      border: 1px solid #d0d8e3;
      border-radius: 16px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      display: none;
      padding: 4px 0;
    }
    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f4fc;
      font-size: 0.95rem;
      transition: 0.1s;
    }
    .suggestion-item:hover {
      background: #f0f7ff;
    }
    .suggestion-item .suggestion-sub {
      font-size: 0.78rem;
      color: #4a5c7a;
      margin-left: 6px;
    }
    .suggestion-item strong {
      color: #0b1a33;
    }
    #locationStatus {
      text-align: center;
      font-size: 0.85rem;
      color: #4d627a;
      margin: 10px 0 6px;
      background: #f4f8ff;
      padding: 8px;
      border-radius: 40px;
    }
    #latitude, #longitude {
      display: none;
      margin-top: 6px;
      background: #f4f8ff;
    }
    #response {
      text-align: center;
      margin: 16px 0 6px;
      font-weight: 500;
      min-height: 28px;
      font-size: 0.95rem;
    }
    .success { color: #1e7e34; }
    .error { color: #c72a2a; }
    .warning { color: #e67e22; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .flex-row {
      display: flex;
      gap: 8px;
    }
    .flex-row .input-group { flex: 1; }
    .mt-1 { margin-top: 8px; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #d0d8d3;
      color: #1f2a44;
      padding: 12px;
    }
    .btn-outline:hover {
      background: #eef2f7;
      border-color: #b0bed0;
    }
    select { appearance: auto; }
    .inline-icon { font-size: 1.2rem; }
    hr { border: none; border-top: 1px solid #e2e9f3; margin: 12px 0; }
    .search-loading {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: #2d8f4a;
      font-weight: 500;
      display: none;
    }
    .search-loading.active {
      display: block;
    }
    .duplicate-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px 14px;
      border-radius: 10px;
      margin: 8px 0;
      font-size: 0.9rem;
      display: none;
    }
    .duplicate-warning.show {
      display: block;
    }
    .validation-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #1a6bff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>⚡ Transformer Data Capture</h2>

  <form id="form" autocomplete="off">
    <div class="input-group">
      <label for="transformerSearch">🔍 Search transformer (name, ID, feeder)</label>
      <input 
        type="text" 
        id="transformerSearch" 
        placeholder="type to search …" 
        autocomplete="off"
        spellcheck="false"
        disabled
      >
      <div class="search-loading" id="searchLoading">Loading...</div>
      <div id="suggestions" class="suggestions-box"></div>
    </div>

    <div class="input-group">
      <label for="voltageLevel">Voltage Level</label>
      <select id="voltageLevel" onchange="updateFeeders()" required>
        <option value="">Select</option>
        <option value="11kv">11 kV</option>
        <option value="33kv">33 kV</option>
      </select>
    </div>

    <div class="input-group">
      <label for="feederName">Feeder Name</label>
      <select id="feederName" onchange="populateFeederId()" required>
        <option value="">Select Feeder</option>
      </select>
    </div>

    <div class="input-group">
      <label for="feederId">Feeder ID</label>
      <input type="text" id="feederId" placeholder="autofilled" readonly required>
    </div>

    <div class="input-group">
      <label for="dtrId">DTR ID <span id="dtrValidationStatus"></span></label>
      <input type="text" id="dtrId" placeholder="e.g. DTR-123" required>
    </div>

    <div class="input-group">
      <label for="name">Transformer Name</label>
      <input type="text" id="name" placeholder="e.g. Unical-A" required>
    </div>

    <div class="input-group">
      <label for="townArea">Town Area</label>
      <input type="text" id="townArea" placeholder="e.g. Anantigha" required>
    </div>

    <div class="input-group">
      <label for="capacity">DTR Capacity</label>
      <select id="capacity" required>
        <option value="">Select</option>
        <option value="50kVA">50 kVA</option><option value="100kVA">100 kVA</option>
        <option value="200kVA">200 kVA</option><option value="300kVA">300 kVA</option>
        <option value="500kVA">500 kVA</option><option value="750kVA">750 kVA</option>
        <option value="1000kVA">1000 kVA</option><option value="1350kVA">1350 kVA</option>
        <option value="1500kVA">1500 kVA</option><option value="2000kVA">2000 kVA</option>
        <option value="2500kVA">2500 kVA</option>
      </select>
    </div>

    <div class="input-group">
      <label for="dtrType">DTR Type</label>
      <select id="dtrType" required>
        <option value="">Select</option>
        <option value="Public">Public</option>
        <option value="Private">Private</option>
      </select>
    </div>

    <div class="input-group">
      <label for="mounting">Mounting Type</label>
      <select id="mounting" required>
        <option value="">Select</option>
        <option value="Plinth">Plinth</option>
        <option value="Pole">Pole</option>
      </select>
    </div>

    <div class="input-group">
      <label for="dtrManufacture">Manufacturer</label>
      <input type="text" id="dtrManufacture" placeholder="e.g. ABB">
    </div>

    <div class="input-group">
      <label for="serialNumber">Serial Number</label>
      <input type="text" id="serialNumber" placeholder="SN-2024">
    </div>

    <div class="input-group">
      <label for="manufacturingDate">Manufacturing Date</label>
      <input type="date" id="manufacturingDate">
    </div>

    <div class="input-group">
      <label for="dtrStatus">DTR Status</label>
      <select id="dtrStatus" required>
        <option value="">Select</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="New plinth">New plinth</option>
      </select>
    </div>

    <div class="input-group">
      <label for="numUprisers">Number of Uprisers</label>
      <input type="number" id="numUprisers" placeholder="0" min="0" required>
    </div>

    <div class="input-group">
      <label for="metered">Is It Metered?</label>
      <select id="metered" onchange="toggleMeteringType()" required>
        <option value="">Select</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="input-group">
      <label for="meteringType">Metering Type</label>
      <select id="meteringType" required>
        <option value="">Select</option>
        <option value="Primary">Primary</option>
        <option value="Secondary">Secondary</option>
        <option value="N/A">Not Applicable</option>
      </select>
    </div>

    <div id="duplicateWarning" class="duplicate-warning">
      ⚠️ <span id="duplicateMessage">This Transformer ID already exists in the submission database!</span>
    </div>

    <div style="display: flex; gap: 8px; margin: 8px 0;">
      <button type="button" onclick="getLocation()" style="background: #1f7b4d; padding: 12px;">📍 Capture Location</button>
    </div>
    <p id="locationStatus">📍 Location not captured</p>
    <input type="text" id="latitude" placeholder="Latitude" readonly>
    <input type="text" id="longitude" placeholder="Longitude" readonly>

    <button type="submit" id="submitBtn" style="margin-top: 18px; background: #0b2b5c;">
      <span class="btn-text">✅ Submit Data</span>
    </button>

    <a href="https://docs.google.com/spreadsheets/d/1qVCLY2fMHe39hW693jzoUBLTk9vBVMocfOdCkPnWIL4/edit?usp=drivesdk" 
       target="_blank" class="btn-link" style="margin-top: 12px;">
       📊 View Report
    </a>
  </form>
  <p id="response"></p>
</div>

<script>
  // --------------------------------------------------------------
  // CONFIG
  const scriptURL = "https://script.google.com/macros/s/AKfycbzGAWIjluH14yOFK5PcXWAdUSZ-0LdA_OGSt-2VwEojo2Pb5KNgD7VwmgUaSPosBQ/exec";
  const sheetURL = "https://script.google.com/macros/s/AKfycbxHY_PYmo4wwzmasQAKtO73hHofXJF0ms9olsZBVbw4UDFPUg5TywlqiySPlHfy28oc/exec";
  
  // Submission sheet URL for duplicate checking - using the same URL but with GET method
  const submissionCheckURL = "https://script.google.com/macros/s/AKfycbzGAWIjluH14yOFK5PcXWAdUSZ-0LdA_OGSt-2VwEojo2Pb5KNgD7VwmgUaSPosBQ/exec";

  // --------------------------------------------------------------
  // FEEDER DATABASE
  const feederDatabase = {
    "11kv": [
      { name: "Unical-A", id: "1165" }, { name: "Unical-B", id: "1194" },
      { name: "Cameroun", id: "1195" }, { name: "Anantigha", id: "8982" },
      { name: "8miles", id: "1188" }
    ],
    "33kv": [
      { name: "Waterboard-A", id: "200" }, { name: "Waterboard-B", id: "182" },
      { name: "Diamond Hills", id: "162" }, { name: "Amika", id: "163" },
      { name: "Amika Gamma", id: "999" }, { name: "Amika Urban A", id: "989" },
      { name: "Amika Urban B", id: "989" }, { name: "Tinapa Road", id: "195" },
      { name: "Akamkpa Urban", id: "195" }, { name: "Akamkpa", id: "157" }
    ]
  };

  // --------------------------------------------------------------
  // DOM REFS
  const searchInput = document.getElementById('transformerSearch');
  const suggestionsBox = document.getElementById('suggestions');
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const responseEl = document.getElementById('response');
  const searchLoading = document.getElementById('searchLoading');
  const duplicateWarning = document.getElementById('duplicateWarning');
  const duplicateMessage = document.getElementById('duplicateMessage');
  const dtrIdInput = document.getElementById('dtrId');
  const dtrValidationStatus = document.getElementById('dtrValidationStatus');

  // --------------------------------------------------------------
  // LOAD DATA FROM BOTH SHEETS
  let transformers = [];
  let submissionData = [];
  let isDataLoaded = false;
  let isSubmissionDataLoaded = false;

  function loadTransformerData() {
    searchLoading.classList.add('active');
    searchInput.disabled = true;
    searchInput.placeholder = 'Loading data...';

    // Load search data
    fetch(sheetURL)
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        transformers = data;
        isDataLoaded = true;
        searchInput.disabled = false;
        searchInput.placeholder = 'type to search …';
        searchLoading.classList.remove('active');
        console.log(`✅ Loaded ${transformers.length} transformer records for search`);
      })
      .catch(err => {
        console.warn("Transformer data load error:", err);
        searchInput.disabled = false;
        searchInput.placeholder = 'Search unavailable';
        searchLoading.classList.remove('active');
        const statusMsg = document.createElement('div');
        statusMsg.style.cssText = 'color: #c72a2a; font-size: 0.8rem; margin-top: 4px;';
        statusMsg.textContent = '⚠️ Could not load transformer data';
        searchInput.parentNode.appendChild(statusMsg);
        setTimeout(() => statusMsg.remove(), 5000);
      });

    // Load submission data for duplicate checking
    fetch(submissionCheckURL + '?action=getData')
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        submissionData = data;
        isSubmissionDataLoaded = true;
        console.log(`✅ Loaded ${submissionData.length} records from submission sheet for duplicate checking`);
      })
      .catch(err => {
        console.warn("Submission data load error:", err);
        isSubmissionDataLoaded = false;
        // Try alternative approach - load from the view sheet
        loadSubmissionDataFromView();
      });
  }

  // Fallback: Try to load from the view sheet
  function loadSubmissionDataFromView() {
    fetch(sheetURL)
      .then(res => res.json())
      .then(data => {
        // This is a fallback - we'll use the view sheet data for duplicate checking
        submissionData = data;
        isSubmissionDataLoaded = true;
        console.log(`⚠️ Using view sheet data as fallback for duplicate checking (${submissionData.length} records)`);
      })
      .catch(err => {
        console.warn("Fallback data load also failed:", err);
        isSubmissionDataLoaded = false;
      });
  }

  // Start loading immediately
  loadTransformerData();

  // --------------------------------------------------------------
  // CHECK DUPLICATE DTR ID AGAINST SUBMISSION SHEET ONLY
  function checkDuplicateDTRId(dtrId) {
    if (!isSubmissionDataLoaded || !submissionData.length) {
      return false;
    }
    
    const trimmedId = dtrId.trim();
    if (!trimmedId) return false;
    
    return submissionData.some(item => {
      const existingId = String(item.DTRID || '').trim();
      return existingId.toLowerCase() === trimmedId.toLowerCase();
    });
  }

  // Real-time duplicate check with debounce
  let duplicateCheckTimeout;
  dtrIdInput.addEventListener('input', function() {
    clearTimeout(duplicateCheckTimeout);
    const dtrId = this.value.trim();
    
    if (!dtrId || !isSubmissionDataLoaded) {
      duplicateWarning.classList.remove('show');
      dtrValidationStatus.innerHTML = '';
      return;
    }
    
    // Show checking status
    dtrValidationStatus.innerHTML = '<span class="validation-spinner"></span> checking...';
    dtrValidationStatus.style.color = '#666';
    
    duplicateCheckTimeout = setTimeout(() => {
      const isDuplicate = checkDuplicateDTRId(dtrId);
      if (isDuplicate) {
        duplicateMessage.textContent = `Transformer ID "${dtrId}" already exists in the submission database!`;
        duplicateWarning.classList.add('show');
        dtrValidationStatus.innerHTML = '❌ Duplicate';
        dtrValidationStatus.style.color = '#c72a2a';
      } else {
        duplicateWarning.classList.remove('show');
        dtrValidationStatus.innerHTML = '✅ Available';
        dtrValidationStatus.style.color = '#1e7e34';
      }
    }, 300);
  });

  // Also check when selecting from search results
  // The search result click handler already populates DTR ID, so we trigger the check
  
  // --------------------------------------------------------------
  // AUTO SEARCH (as you type)
  function performAutoSearch() {
    if (!isDataLoaded) {
      suggestionsBox.style.display = 'none';
      return;
    }

    const keyword = searchInput.value.trim().toLowerCase();
    suggestionsBox.innerHTML = '';
    if (keyword.length < 1) {
      suggestionsBox.style.display = 'none';
      return;
    }

    const matches = transformers.filter(item => {
      const name = String(item.DTR_NAME || '').toLowerCase();
      const dtrId = String(item.DTRID || '').toLowerCase();
      const f11 = String(item.FEEDER11NAME || '').toLowerCase();
      const f33 = String(item.FEEDER33NAME || '').toLowerCase();
      const f11id = String(item.FEEDER11ID || '').toLowerCase();
      const f33id = String(item.FEEDER33ID || '').toLowerCase();
      return name.includes(keyword) || dtrId.includes(keyword) ||
             f11.includes(keyword) || f33.includes(keyword) ||
             f11id.includes(keyword) || f33id.includes(keyword);
    }).slice(0, 8);

    if (matches.length === 0) {
      suggestionsBox.style.display = 'none';
      return;
    }

    matches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      const feederName = item.FEEDER11NAME || item.FEEDER33NAME || 'N/A';
      div.innerHTML = `
        <strong>${item.DTR_NAME || 'Unnamed'}</strong>
        <span class="suggestion-sub">ID: ${item.DTRID || '—'}</span><br>
        <span class="suggestion-sub">Feeder: ${feederName}</span>
      `;
      div.addEventListener('click', () => {
        document.getElementById('name').value = item.DTR_NAME || '';
        document.getElementById('dtrId').value = item.DTRID || '';
        searchInput.value = item.DTR_NAME || '';

        // Trigger duplicate check for the selected DTR ID
        const event = new Event('input');
        dtrIdInput.dispatchEvent(event);

        const f11 = item.FEEDER11NAME || '';
        const f33 = item.FEEDER33NAME || '';
        let voltage = '';
        let feederNameMatch = '';
        if (f11) { voltage = '11kv'; feederNameMatch = f11; }
        else if (f33) { voltage = '33kv'; feederNameMatch = f33; }

        if (voltage) {
          const vSelect = document.getElementById('voltageLevel');
          vSelect.value = voltage;
          updateFeeders();
          const fSelect = document.getElementById('feederName');
          let found = false;
          for (let opt of fSelect.options) {
            if (opt.value === feederNameMatch) {
              fSelect.value = feederNameMatch;
              found = true;
              break;
            }
          }
          if (!found) {
            const list = feederDatabase[voltage] || [];
            const matched = list.find(f => 
              f.name.toLowerCase() === feederNameMatch.toLowerCase() ||
              feederNameMatch.toLowerCase().includes(f.name.toLowerCase()) ||
              f.name.toLowerCase().includes(feederNameMatch.toLowerCase())
            );
            if (matched) {
              fSelect.value = matched.name;
            }
          }
          populateFeederId();
        }
        suggestionsBox.style.display = 'none';
      });
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.style.display = 'block';
  }

  searchInput.addEventListener('input', performAutoSearch);
  searchInput.addEventListener('focus', function() {
    if (this.value.trim().length > 0 && isDataLoaded) performAutoSearch();
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-group')) {
      suggestionsBox.style.display = 'none';
    }
  });

  // --------------------------------------------------------------
  // EXISTING FUNCTIONS
  function updateFeeders() {
    const voltage = document.getElementById('voltageLevel').value;
    const feederSelect = document.getElementById('feederName');
    feederSelect.innerHTML = '<option value="">Select Feeder</option>';
    document.getElementById('feederId').value = '';
    if (voltage && feederDatabase[voltage]) {
      feederDatabase[voltage].forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.name;
        opt.textContent = f.name;
        feederSelect.appendChild(opt);
      });
    }
  }

  function populateFeederId() {
    const voltage = document.getElementById('voltageLevel').value;
    const selected = document.getElementById('feederName').value;
    const idInput = document.getElementById('feederId');
    if (!selected || !voltage) { idInput.value = ''; return; }
    const list = feederDatabase[voltage] || [];
    const match = list.find(f => f.name === selected);
    idInput.value = match ? match.id : '';
  }

  function toggleMeteringType() {
    const metered = document.getElementById('metered').value;
    const mt = document.getElementById('meteringType');
    if (metered === 'No') {
      mt.value = 'N/A';
      mt.disabled = true;
    } else {
      mt.value = '';
      mt.disabled = false;
    }
  }

  function getLocation() {
    const status = document.getElementById('locationStatus');
    if (!navigator.geolocation) {
      alert('Geolocation not supported');
      return;
    }
    status.innerText = '⏳ Capturing location...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('latitude').value = pos.coords.latitude;
        document.getElementById('longitude').value = pos.coords.longitude;
        document.getElementById('latitude').style.display = 'block';
        document.getElementById('longitude').style.display = 'block';
        status.innerText = '✅ Location captured';
      },
      () => {
        alert('Unable to retrieve location');
        status.innerText = '❌ Failed to get location';
      }
    );
  }

  // --------------------------------------------------------------
  // SUBMIT with duplicate check
  function showSpinner() {
    const btnText = submitBtn.querySelector('.btn-text');
    submitBtn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> Submitting...';
  }
  function hideSpinner() {
    const btnText = submitBtn.querySelector('.btn-text');
    submitBtn.disabled = false;
    btnText.textContent = '✅ Submit Data';
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (submitBtn.disabled) return;

    const dtrId = dtrIdInput.value.trim();
    const lat = document.getElementById('latitude').value;
    const lng = document.getElementById('longitude').value;

    // Check for duplicate DTR ID against submission sheet only
    if (dtrId && isSubmissionDataLoaded) {
      const isDuplicate = checkDuplicateDTRId(dtrId);
      if (isDuplicate) {
        duplicateMessage.textContent = `Transformer ID "${dtrId}" already exists in the submission database!`;
        duplicateWarning.classList.add('show');
        responseEl.textContent = '❌ Submission failed: Duplicate Transformer ID in submission database';
        responseEl.className = 'error';
        duplicateWarning.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
    } else if (dtrId && !isSubmissionDataLoaded) {
      responseEl.textContent = '⚠️ Cannot verify duplicate - submission data not loaded. Please refresh.';
      responseEl.className = 'warning';
      return;
    }

    if (!lat || !lng) {
      responseEl.textContent = '⚠️ Please capture location first';
      responseEl.className = 'error';
      return;
    }

    const data = {
      voltage: document.getElementById('voltageLevel').value,
      feeder: document.getElementById('feederName').value,
      feederId: document.getElementById('feederId').value,
      dtrId: dtrId,
      name: document.getElementById('name').value,
      townArea: document.getElementById('townArea').value,
      capacity: document.getElementById('capacity').value,
      dtrType: document.getElementById('dtrType').value,
      mounting: document.getElementById('mounting').value,
      dtrManufacture: document.getElementById('dtrManufacture').value,
      serialNumber: document.getElementById('serialNumber').value,
      manufacturingDate: document.getElementById('manufacturingDate').value,
      dtrStatus: document.getElementById('dtrStatus').value,
      numUprisers: document.getElementById('numUprisers').value,
      metered: document.getElementById('metered').value,
      meteringType: document.getElementById('meteringType').value,
      latitude: lat,
      longitude: lng
    };

    showSpinner();
    responseEl.textContent = '⏳ Submitting...';
    responseEl.className = '';

    fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' },
      mode: 'no-cors'
    })
    .then(() => {
      responseEl.textContent = '✅ Submitted successfully!';
      responseEl.className = 'success';
      form.reset();
      document.getElementById('latitude').style.display = 'none';
      document.getElementById('longitude').style.display = 'none';
      document.getElementById('meteringType').disabled = false;
      document.getElementById('locationStatus').innerText = '📍 Location not captured';
      document.getElementById('transformerSearch').value = '';
      suggestionsBox.style.display = 'none';
      duplicateWarning.classList.remove('show');
      dtrValidationStatus.innerHTML = '';
      hideSpinner();
      
      // Refresh submission data after successful submission
      setTimeout(() => {
        loadSubmissionDataFromView();
      }, 2000);
    })
    .catch((err) => {
      responseEl.textContent = '❌ Submission failed. Please try again.';
      responseEl.className = 'error';
      console.error(err);
      hideSpinner();
    });
  });

  // init feeder dropdown
  updateFeeders();
</script>
</body>
</html>
