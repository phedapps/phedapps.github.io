<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PHED GIS · Project & Transformer Capture</title>

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- EXCEL + PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0; background: #f4f6f8; overflow-x: hidden;
    }
    header { background: #004aad; color: white; padding: 8px; text-align: center; }
    footer {
      background: #004aad; color: white; text-align: center;
      padding: 8px; font-size: 12px; position: fixed; bottom: 0; width: 100%;
    }
    #globalError {
      width: 100%; text-align: center; color: white; background: #cc0000;
      padding: 8px; font-size: 14px; display: none; position: fixed;
      bottom: 40px; left: 0; z-index: 9999;
    }
    .container { padding: 8px; margin-bottom: 70px; max-width: 100%; }
    .card { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    input, select {
      padding: 8px; width: 100%; border-radius: 6px;
      border: 1px solid #aaa; font-size: 16px;
    }
    button {
      padding: 8px; background: #0066ff; color: white;
      border: none; border-radius: 6px; margin: 3px 0; cursor: pointer;
    }
    button:disabled { background: #7ba6ff !important; cursor: not-allowed; }
    .add-asset-row {
      display: flex; justify-content: center; margin-top: 12px;
    }
    #addAssetBtn {
      min-width: 100px; background: #008000; font-weight: bold;
    }
    .table-wrapper {
      overflow-x: auto; background: white; border-radius: 8px; padding: 5px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px; text-align: center; }
    th { background: #004aad; color: white; }
    #dataTable tbody tr:nth-child(odd) { background: #e9f3ff; }
    #dataTable tbody tr:nth-child(even) { background: white; }
    #transformerTable tbody tr:nth-child(odd) { background: #fff0e6; }
    #transformerTable tbody tr:nth-child(even) { background: #fffaf5; }
    .small-btn { padding: 5px; font-size: 12px; }
    .captureBtn { background: #007bff; }
    .edit-btn { background: #ff9900; }
    .delete-btn { background: #cc0000; }

    /* ---- MODE TABS: side by side ---- */
    .mode-selector {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin: 0 0 12px 0;
      background: transparent;
      padding: 0;
      border-radius: 0;
    }
    .mode-selector button {
      background: #d0d8e0;
      color: #004aad;
      border: 2px solid #004aad;
      padding: 10px 28px;
      font-weight: bold;
      border-radius: 30px 30px 0 0;
      margin: 0;
      flex: 0 1 auto;
      font-size: 15px;
      transition: 0.15s;
    }
    .mode-selector button.active {
      background: #004aad;
      color: white;
      border-bottom-color: transparent;
    }
    .mode-selector button i { margin-right: 6px; }

    /* ---- color-coded containers ---- */
    #projectSection {
      background: #f0f7ff;
      border-left: 6px solid #004aad;
      border-radius: 0 8px 8px 8px;
    }
    #transformerSection {
      background: #fff5ed;
      border-left: 6px solid #cc7a00;
      border-radius: 0 8px 8px 8px;
    }
    #projectSection .card, #transformerSection .card {
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    /* bottom export bar - all in one line */
    .bottom-export-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
      border-top: 1px solid #ddd;
      padding-top: 12px;
    }
    .bottom-export-bar button {
      background: white;
      color: black;
      border: 1px solid #004aad;
      padding: 6px 18px;
      font-weight: 600;
      font-size: 13px;
      border-radius: 6px;
      min-width: 70px;
    }
    .bottom-export-bar button i { margin-right: 4px; }
    .bottom-export-bar .reset-btn {
      border-color: #cc0000;
      color: #cc0000;
    }

    @media(max-width:600px) {
      .mode-selector button { padding: 8px 14px; font-size: 13px; }
      .bottom-export-bar button { min-width: 60px; padding: 5px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h2 id="projectTitleHeader">PHED GIS Capture</h2>
  <div id="projectDate" style="display:none"></div>
</header>

<div id="globalError"></div>

<div class="container">

  <!-- ===== MODE TABS: side by side ===== -->
  <div class="mode-selector">
    <button id="modeProjectBtn" class="active" onclick="switchMode('project')"><i class="fa-solid fa-map"></i> Project GIS</button>
    <button id="modeTransformerBtn" onclick="switchMode('transformer')"><i class="fa-solid fa-bolt"></i> Transformer</button>
  </div>

  <!-- ===== PROJECT GIS CAPTURE ===== -->
  <div id="projectSection">
    <div id="titleSection" class="card" style="background:transparent; padding:0;">
      <h3>Enter Project Title</h3>
      <input type="text" id="projectTitleInput" placeholder="E.g. Installation of 300KVA Substation for FHE Calabar" />
      <button onclick="startProjectApp()" style="width:30%;margin:12px auto;display:block;">Start</button>
    </div>

    <div id="projectAppContent" style="display:none; padding:0;">
      <div class="table-wrapper">
        <table id="dataTable">
          <thead><tr><th>S/N</th><th>Qty</th><th>Asset</th><th>Lat</th><th>Lon</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="add-asset-row">
        <button style="background:white;color:black;border:1px solid blue" id="addAssetBtn" onclick="addProjectRow()">➕ Add Asset</button>
      </div>
      <div class="bottom-export-bar">
        <button class="reset-btn" onclick="resetProject()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        <button onclick="exportExcelProject()"><i class="fa-regular fa-file-excel"></i> Excel</button>
        <button onclick="exportPDFProject()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
        <button onclick="exportKMLProject()"><i class="fa-solid fa-map-location-dot"></i> KML</button>
      </div>
    </div>
  </div>

  <!-- ===== TRANSFORMER CAPTURE ===== -->
  <div id="transformerSection" style="display:none;">
    <div id="transformerTitleSection" class="card" style="background:transparent; padding:0;">
      <h3>Enter Feeder Name</h3>
      <input type="text" id="feederNameInput" placeholder="E.g. MCC Feeder" />
      <button onclick="startTransformerApp()" style="width:30%;margin:12px auto;display:block;">Start</button>
    </div>

    <div id="transformerAppContent" style="display:none; padding:0;">
      <div class="table-wrapper">
        <table id="transformerTable">
          <thead><tr><th>S/N</th><th>DTR Name</th><th>Capacity</th><th>Remark</th><th>Lat</th><th>Lon</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="add-asset-row">
        <button style="background:white;color:black;border:1px solid blue" id="addTransformerBtn" onclick="addTransformerRow()">➕ Add Transformer</button>
      </div>
      <div class="bottom-export-bar">
        <button class="reset-btn" onclick="resetTransformer()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        <button onclick="exportExcelTransformer()"><i class="fa-regular fa-file-excel"></i> Excel</button>
        <button onclick="exportPDFTransformer()"><i class="fa-regular fa-file-pdf"></i> PDF</button>
        <button onclick="exportKMLTransformer()"><i class="fa-solid fa-map-location-dot"></i> KML</button>
      </div>
    </div>
  </div>

</div>

<footer>Designed by <strong>Obot Akpan</strong></footer>

<script>
// ─────────────────────────────────────────────────────────────
//  GLOBALS
// ─────────────────────────────────────────────────────────────
let projectData = [];
let transformerData = [];
let globalDate = "";
let currentMode = "project";

// ─── ERROR BAR ──────────────────────────────────────────────
function showGlobalError(msg) {
  const bar = document.getElementById("globalError");
  bar.innerHTML = "⚠ " + msg;
  bar.style.display = "block";
  setTimeout(() => bar.style.display = "none", 3000);
}

// ─── MODE SWITCH ────────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  document.getElementById("modeProjectBtn").classList.toggle("active", mode === "project");
  document.getElementById("modeTransformerBtn").classList.toggle("active", mode === "transformer");
  document.getElementById("projectSection").style.display = mode === "project" ? "block" : "none";
  document.getElementById("transformerSection").style.display = mode === "transformer" ? "block" : "none";
  const dateEl = document.getElementById("projectDate");
  if (mode === "project") {
    dateEl.style.display = document.getElementById("projectAppContent").style.display === "block" ? "block" : "none";
  } else {
    dateEl.style.display = document.getElementById("transformerAppContent").style.display === "block" ? "block" : "none";
  }
  document.getElementById("projectTitleHeader").innerText = 
    mode === "project" ? "PHED GIS · Project" : "PHED GIS · Transformer";
}

// ─── DATE HELPER ────────────────────────────────────────────
function getFormattedDate() {
  const d = new Date();
  let day = d.getDate();
  const suffix = (day >= 11 && day <= 13) ? "th" :
    (day % 10 === 1) ? "st" :
    (day % 10 === 2) ? "nd" :
    (day % 10 === 3) ? "rd" : "th";
  day = day + suffix;
  const monthNames = ["January","February","March","April","May","June",
    "July","August","September","October","November","December"];
  return `${day} ${monthNames[d.getMonth()]}, ${d.getFullYear()}`;
}

// ─── LOCAL STORAGE ──────────────────────────────────────────
function saveAllToLocal() {
  const saved = {
    project: { title: document.getElementById("projectTitleHeader").innerText, date: globalDate, data: projectData },
    transformer: { feeder: document.getElementById("projectTitleHeader").innerText, date: globalDate, data: transformerData }
  };
  localStorage.setItem("gisCaptureAll", JSON.stringify(saved));
}

function loadAllFromLocal() {
  const raw = localStorage.getItem("gisCaptureAll");
  if (!raw) return;
  try {
    const { project, transformer } = JSON.parse(raw);
    if (project && project.data) {
      projectData = project.data;
      globalDate = project.date || getFormattedDate();
      document.getElementById("projectTitleHeader").innerText = project.title || "PHED GIS";
      document.getElementById("projectDate").innerText = "Date: " + globalDate;
      document.getElementById("projectDate").style.display = "block";
      document.getElementById("titleSection").style.display = "none";
      document.getElementById("projectAppContent").style.display = "block";
      renderProjectTable();
    }
    if (transformer && transformer.data) {
      transformerData = transformer.data;
      globalDate = transformer.date || getFormattedDate();
      document.getElementById("projectTitleHeader").innerText = transformer.feeder || "PHED GIS";
      document.getElementById("projectDate").innerText = "Date: " + globalDate;
      document.getElementById("projectDate").style.display = "block";
      document.getElementById("transformerTitleSection").style.display = "none";
      document.getElementById("transformerAppContent").style.display = "block";
      renderTransformerTable();
    }
  } catch(e) { /* ignore */ }
}

window.onload = function() {
  loadAllFromLocal();
  switchMode("project");
};

window.onbeforeunload = function() {
  return "Your GIS data will be lost if you leave this page.";
};

// ─────────────────────────────────────────────────────────────
//  PROJECT GIS CAPTURE
// ─────────────────────────────────────────────────────────────
function startProjectApp() {
  const title = document.getElementById("projectTitleInput").value.trim();
  if (!title) return showGlobalError("Please enter a project title.");
  document.getElementById("projectTitleHeader").innerText = title;
  globalDate = getFormattedDate();
  document.getElementById("projectDate").innerText = "Date: " + globalDate;
  document.getElementById("projectDate").style.display = "block";
  document.getElementById("titleSection").style.display = "none";
  document.getElementById("projectAppContent").style.display = "block";
  saveAllToLocal();
}

function resetProject() {
  if (!confirm("Reset all project data?")) return;
  projectData = [];
  document.querySelector("#dataTable tbody").innerHTML = "";
  document.getElementById("projectTitleInput").value = "";
  document.getElementById("titleSection").style.display = "block";
  document.getElementById("projectAppContent").style.display = "none";
  document.getElementById("projectDate").style.display = "none";
  saveAllToLocal();
  showGlobalError("✅ Project reset.");
}

function renderProjectTable() {
  const tbody = document.querySelector("#dataTable tbody");
  tbody.innerHTML = "";
  projectData.forEach(item => {
    const row = document.createElement("tr");
    row.dataset.id = item.id;
    row.dataset.captured = "true";
    row.innerHTML = `
      <td></td>
      <td><input type="number" class="qtyInput" value="${item.quantity || 1}" min="1" style="width:60px;text-align:center;" disabled></td>
      <td><select class="assetSelect" disabled><option>${item.asset}</option></select></td>
      <td>${item.lat}</td>
      <td>${item.lng}</td>
      <td>
        <button class="small-btn edit-btn" onclick="editProjectRow(this)"><i class="fa-solid fa-pen"></i></button>
        <button class="small-btn delete-btn" onclick="deleteProjectRow(this)"><i class="fa-solid fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(row);
  });
  updateProjectSerialNumbers();
}

function updateProjectSerialNumbers() {
  const rows = document.querySelectorAll("#dataTable tbody tr");
  rows.forEach((row, i) => row.cells[0].innerText = i + 1);
}

function addProjectRow() {
  const last = document.querySelector("#dataTable tbody tr:last-child");
  if (last && !last.dataset.captured) return showGlobalError("Complete previous asset first.");
  const table = document.querySelector("#dataTable tbody");
  const row = table.insertRow();
  const rowId = Date.now() + Math.random();
  row.dataset.id = rowId;
  row.dataset.captured = "";
  row.innerHTML = `
    <td></td>
    <td><input type="number" class="qtyInput" value="1" min="1" style="width:60px;text-align:center;"></td>
    <td>
      <select class="assetSelect">
        <option value="" disabled selected>Select</option>
        <option value="Transformer">Transformer</option>
        <option value="40ft HT Pole">40ft HT Pole</option>
        <option value="34ft HT Pole">34ft HT Pole</option>
        <option value="28ft LT Pole">28ft LT Pole</option>
        <option value="33kV Gang Isolator">33kV Gang Isolator</option>
        <option value="11kV Gang Isolator">11kV Gang Isolator</option>
        <option value="Auto Recloser">Auto Recloser</option>
      </select>
    </td>
    <td colspan="2" class="captureCell">
      <button class="captureBtn small-btn" onclick="captureProjectLocation(this)"><i class="fa-solid fa-location-crosshairs"></i> Capture</button>
    </td>
    <td>
      <button class="small-btn edit-btn" disabled onclick="editProjectRow(this)"><i class="fa-solid fa-pen"></i></button>
      <button class="small-btn delete-btn" onclick="deleteProjectRow(this)"><i class="fa-solid fa-trash"></i></button>
    </td>
  `;
  updateProjectSerialNumbers();
  saveAllToLocal();
}

function captureProjectLocation(btn) {
  const row = btn.closest("tr");
  const asset = row.querySelector(".assetSelect");
  const qty = row.querySelector(".qtyInput");
  if (!asset.value) return showGlobalError("Select an asset.");
  if (!qty.value || parseInt(qty.value) < 1) return showGlobalError("Valid quantity required.");
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      btn.parentElement.remove();
      const latCell = document.createElement("td"); latCell.innerText = lat;
      const lngCell = document.createElement("td"); lngCell.innerText = lng;
      row.insertBefore(latCell, row.children[3]);
      row.insertBefore(lngCell, row.children[4]);
      row.dataset.captured = "true";
      asset.disabled = true;
      qty.disabled = true;
      row.querySelector(".edit-btn").disabled = false;
      projectData = projectData.filter(r => r.id !== row.dataset.id);
      projectData.push({ id: row.dataset.id, quantity: parseInt(qty.value), asset: asset.value, lat, lng });
      saveAllToLocal();
    },
    () => showGlobalError("GPS unavailable.")
  );
}

function editProjectRow(btn) {
  if (!confirm("Edit this record?")) return;
  const row = btn.closest("tr");
  row.dataset.captured = "";
  projectData = projectData.filter(r => r.id !== row.dataset.id);
  row.children[3].remove(); row.children[3].remove();
  const cap = document.createElement("td");
  cap.colSpan = 2;
  cap.className = "captureCell";
  cap.innerHTML = `<button class="captureBtn small-btn" onclick="captureProjectLocation(this)"><i class="fa-solid fa-location-crosshairs"></i> Recapture</button>`;
  row.insertBefore(cap, row.children[3]);
  row.querySelector(".assetSelect").disabled = false;
  row.querySelector(".qtyInput").disabled = false;
  saveAllToLocal();
}

function deleteProjectRow(btn) {
  if (!confirm("Delete?")) return;
  const row = btn.closest("tr");
  projectData = projectData.filter(r => r.id !== row.dataset.id);
  row.remove();
  updateProjectSerialNumbers();
  saveAllToLocal();
}

function exportExcelProject() {
  if (projectData.length === 0) return showGlobalError("No project data.");
  const data = projectData.map((item, i) => ({ "S/N": i+1, "Qty": item.quantity||1, "Asset": item.asset, "Lat": item.lat, "Lon": item.lng }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Project");
  XLSX.writeFile(wb, "Project_GIS.xlsx");
}

function exportPDFProject() {
  if (projectData.length === 0) return showGlobalError("No project data.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Project GIS Capture", 10, 10);
  doc.text("Date: " + globalDate, 10, 16);
  projectData.forEach((item, i) => {
    doc.text(`${i+1}. ${item.quantity||1} × ${item.asset} | ${item.lat}, ${item.lng}`, 10, 30 + i*10);
  });
  doc.save("Project_GIS.pdf");
}

function exportKMLProject() {
  if (projectData.length === 0) return showGlobalError("No project data.");
  const title = document.getElementById("projectTitleHeader").innerText || "Project";
  let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${title}</name><description>Exported from PHED GIS</description><Style id="s"><IconStyle><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png</href></Icon></IconStyle></Style>`;
  projectData.forEach(item => {
    kml += `<Placemark><name>${item.quantity||1} × ${item.asset}</name><description>${item.asset} | ${item.lat}, ${item.lng}</description><styleUrl>#s</styleUrl><Point><coordinates>${item.lng},${item.lat},0</coordinates></Point></Placemark>`;
  });
  kml += `</Document></kml>`;
  const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Project_GIS.kml"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showGlobalError("✅ KML exported.");
}

// ─────────────────────────────────────────────────────────────
//  TRANSFORMER CAPTURE (FIXED: edit/delete stay on right)
// ─────────────────────────────────────────────────────────────
function startTransformerApp() {
  const feeder = document.getElementById("feederNameInput").value.trim();
  if (!feeder) return showGlobalError("Please enter a feeder name.");
  document.getElementById("projectTitleHeader").innerText = feeder;
  globalDate = getFormattedDate();
  document.getElementById("projectDate").innerText = "Date: " + globalDate;
  document.getElementById("projectDate").style.display = "block";
  document.getElementById("transformerTitleSection").style.display = "none";
  document.getElementById("transformerAppContent").style.display = "block";
  saveAllToLocal();
}

function resetTransformer() {
  if (!confirm("Reset all transformer data?")) return;
  transformerData = [];
  document.querySelector("#transformerTable tbody").innerHTML = "";
  document.getElementById("feederNameInput").value = "";
  document.getElementById("transformerTitleSection").style.display = "block";
  document.getElementById("transformerAppContent").style.display = "none";
  document.getElementById("projectDate").style.display = "none";
  saveAllToLocal();
  showGlobalError("✅ Transformer reset.");
}

function renderTransformerTable() {
  const tbody = document.querySelector("#transformerTable tbody");
  tbody.innerHTML = "";
  transformerData.forEach(item => {
    const row = document.createElement("tr");
    row.dataset.id = item.id;
    row.dataset.captured = "true";
    row.innerHTML = `
      <td></td>
      <td><input type="text" class="transNameInput" value="${item.name}" style="width:100px;" disabled></td>
      <td><select class="capacitySelect" disabled><option>${item.capacity}</option></select></td>
      <td><input type="text" class="remarkInput" value="${item.remark || ''}" style="width:100px;" disabled></td>
      <td>${item.lat}</td>
      <td>${item.lng}</td>
      <td>
        <button class="small-btn edit-btn" onclick="editTransformerRow(this)"><i class="fa-solid fa-pen"></i></button>
        <button class="small-btn delete-btn" onclick="deleteTransformerRow(this)"><i class="fa-solid fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(row);
  });
  updateTransformerSerialNumbers();
}

function updateTransformerSerialNumbers() {
  const rows = document.querySelectorAll("#transformerTable tbody tr");
  rows.forEach((row, i) => row.cells[0].innerText = i + 1);
}

function addTransformerRow() {
  const last = document.querySelector("#transformerTable tbody tr:last-child");
  if (last && !last.dataset.captured) return showGlobalError("Complete previous transformer first.");
  const table = document.querySelector("#transformerTable tbody");
  const row = table.insertRow();
  const rowId = Date.now() + Math.random();
  row.dataset.id = rowId;
  row.dataset.captured = "";
  row.innerHTML = `
    <td></td>
    <td><input type="text" class="transNameInput" placeholder="Name" style="width:100px;"></td>
    <td>
      <select class="capacitySelect">
        <option value="" disabled selected>Capacity</option>
        <option value="50KVA">50KVA</option>
        <option value="100KVA">100KVA</option>
        <option value="200KVA">200KVA</option>
        <option value="300KVA">300KVA</option>
        <option value="500KVA">500KVA</option>
        <option value="1MVA">1MVA</option>
        <option value="1.5MVA">1.5MVA</option>
        <option value="3MVA">3MVA</option>
      </select>
    </td>
    <td><input type="text" class="remarkInput" placeholder="Remark" style="width:100px;"></td>
    <td colspan="2" class="captureCell">
      <button class="captureBtn small-btn" onclick="captureTransformerLocation(this)"><i class="fa-solid fa-location-crosshairs"></i> Capture</button>
    </td>
    <td>
      <button class="small-btn edit-btn" disabled onclick="editTransformerRow(this)"><i class="fa-solid fa-pen"></i></button>
      <button class="small-btn delete-btn" onclick="deleteTransformerRow(this)"><i class="fa-solid fa-trash"></i></button>
    </td>
  `;
  updateTransformerSerialNumbers();
  saveAllToLocal();
}

function captureTransformerLocation(btn) {
  const row = btn.closest("tr");
  const nameInput = row.querySelector(".transNameInput");
  const capacitySelect = row.querySelector(".capacitySelect");
  const remarkInput = row.querySelector(".remarkInput");
  if (!nameInput.value.trim()) return showGlobalError("Enter transformer name.");
  if (!capacitySelect.value) return showGlobalError("Select capacity.");
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      
      // Remove the capture button cell (which has colspan=2)
      const captureCell = row.querySelector(".captureCell");
      captureCell.remove();
      
      // Create lat and lon cells
      const latCell = document.createElement("td");
      latCell.innerText = lat;
      const lngCell = document.createElement("td");
      lngCell.innerText = lng;
      
      // Insert lat and lon BEFORE the actions cell (which is the last cell)
      // row.cells.length - 1 gives the index of the last cell (actions)
      const actionsIndex = row.cells.length - 1;
      row.insertBefore(latCell, row.cells[actionsIndex]);
      row.insertBefore(lngCell, row.cells[actionsIndex]);
      
      row.dataset.captured = "true";
      nameInput.disabled = true;
      capacitySelect.disabled = true;
      remarkInput.disabled = true;
      row.querySelector(".edit-btn").disabled = false;
      
      transformerData = transformerData.filter(r => r.id !== row.dataset.id);
      transformerData.push({
        id: row.dataset.id,
        name: nameInput.value.trim(),
        capacity: capacitySelect.value,
        remark: remarkInput.value.trim(),
        lat, lng
      });
      saveAllToLocal();
    },
    () => showGlobalError("GPS unavailable.")
  );
}

function editTransformerRow(btn) {
  if (!confirm("Edit this transformer?")) return;
  const row = btn.closest("tr");
  row.dataset.captured = "";
  transformerData = transformerData.filter(r => r.id !== row.dataset.id);
  
  // Remove lat and lon cells (they are before the actions cell)
  // Actions cell is the last one, so remove cells at index 4 and 5 (0-based)
  row.children[4].remove(); // lat
  row.children[4].remove(); // lon (now at same index after first removal)
  
  // Create a new capture cell with colspan=2 and insert before actions
  const cap = document.createElement("td");
  cap.colSpan = 2;
  cap.className = "captureCell";
  cap.innerHTML = `<button class="captureBtn small-btn" onclick="captureTransformerLocation(this)"><i class="fa-solid fa-location-crosshairs"></i> Recapture</button>`;
  
  // Insert before the actions cell (which is the last cell)
  const actionsIndex = row.cells.length - 1;
  row.insertBefore(cap, row.cells[actionsIndex]);
  
  row.querySelector(".transNameInput").disabled = false;
  row.querySelector(".capacitySelect").disabled = false;
  row.querySelector(".remarkInput").disabled = false;
  saveAllToLocal();
}

function deleteTransformerRow(btn) {
  if (!confirm("Delete?")) return;
  const row = btn.closest("tr");
  transformerData = transformerData.filter(r => r.id !== row.dataset.id);
  row.remove();
  updateTransformerSerialNumbers();
  saveAllToLocal();
}

function exportExcelTransformer() {
  if (transformerData.length === 0) return showGlobalError("No transformer data.");
  const data = transformerData.map((item, i) => ({ "S/N": i+1, "Name": item.name, "Capacity": item.capacity, "Remark": item.remark||'', "Lat": item.lat, "Lon": item.lng }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Transformers");
  XLSX.writeFile(wb, "Transformers.xlsx");
}

function exportPDFTransformer() {
  if (transformerData.length === 0) return showGlobalError("No transformer data.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Transformer Capture", 10, 10);
  doc.text("Feeder: " + document.getElementById("projectTitleHeader").innerText, 10, 16);
  doc.text("Date: " + globalDate, 10, 22);
  transformerData.forEach((item, i) => {
    doc.text(`${i+1}. ${item.name} | ${item.capacity} | ${item.remark||''} | ${item.lat}, ${item.lng}`, 10, 36 + i*10);
  });
  doc.save("Transformers.pdf");
}

function exportKMLTransformer() {
  if (transformerData.length === 0) return showGlobalError("No transformer data.");
  const feeder = document.getElementById("projectTitleHeader").innerText || "Transformers";
  let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${feeder} - Transformers</name><description>Transformer locations</description><Style id="ts"><IconStyle><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png</href></Icon></IconStyle></Style>`;
  transformerData.forEach(item => {
    kml += `<Placemark><name>${item.name}</name><description>Capacity: ${item.capacity} | Remark: ${item.remark||''}</description><styleUrl>#ts</styleUrl><Point><coordinates>${item.lng},${item.lat},0</coordinates></Point></Placemark>`;
  });
  kml += `</Document></kml>`;
  const blob = new Blob([kml], { type: "application/vnd.google-earth.kml+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Transformers.kml"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showGlobalError("✅ KML exported.");
}
</script>
</body>
</html>
