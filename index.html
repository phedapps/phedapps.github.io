<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Capture Portal</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg, #0f172a, #1e3a8a);
        color:white;
    }

    .container{
        text-align:center;
        width:90%;
        max-width:500px;
    }

    h1{
        margin-bottom:15px;
        font-size:2rem;
    }

    p{
        margin-bottom:40px;
        opacity:0.9;
    }

    .btn-container{
        display:flex;
        flex-direction:column;
        gap:20px;
    }

    .btn{
        display:block;
        padding:20px;
        text-decoration:none;
        color:white;
        font-size:1.2rem;
        font-weight:bold;
        border-radius:12px;
        transition:0.3s ease;
        box-shadow:0 4px 10px rgba(0,0,0,0.3);
    }

    .gis-btn{
        background:#16a34a;
    }

    .transformer-btn{
        background:#ea580c;
    }

    .btn:hover{
        transform:translateY(-3px);
        opacity:0.9;
    }

    @media (min-width: 768px){
        .btn-container{
            flex-direction:row;
        }

        .btn{
            flex:1;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h1>PHED Data Capture Portal</h1>
    <p>Designed by Obot Akpan</p>

    <div class="btn-container">
        <a href="gis-capture.html" class="btn gis-btn">
            📍 GIS Capture
        </a>

        <a href="transformer-capture.html" class="btn transformer-btn">
            ⚡ Transformer Capture
        </a>
    </div>
</div>

</body>
</html>
