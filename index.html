<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHED Apps Hub (Unofficial)</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: #f4f7fb;
    color: #1e293b;

    padding: 30px 15px;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 700px;
    margin-bottom: 40px;
}

/* ===== LOGO SECTION ===== */

.logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
}

.logo-container img {
  
    width: clamp(100px, 18vw, 180px);
    height: auto;
    object-fit: contain;
    border-radius: 12px;
    display: block;
    margin-bottom: 6px;
}

.logo-container .logo-text {
    font-size: 0.75rem;
    color: #64748b;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* ===== HEADER ===== */

h1 {
    margin-bottom: 8px;
    font-size: 2rem;
    color: #0f172a;
    font-weight: 700;
}

h1 span {
    color: #64748b;
    font-weight: 500;
}

.subtitle {
    margin-bottom: 40px;
    color: #64748b;
    font-size: 0.95rem;
}

/* ===== BUTTON GRID ===== */

.btn-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* ===== BUTTON ===== */

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    min-height: 85px;
    padding: 20px;

    text-decoration: none;
    color: white;

    font-size: 1.05rem;
    font-weight: bold;

    border-radius: 14px;

    transition: all 0.3s ease;

    box-shadow: 0 5px 15px rgba(15, 23, 42, 0.12);
}

/* ===== ICON ===== */

.btn i {
    font-size: 1.6rem;
}

/* ===== HOVER ===== */

.btn:hover {
    transform: translateY(-5px);

    box-shadow:
        0 10px 22px rgba(15, 23, 42, 0.18);

    filter: brightness(1.05);
}

/* ===== ACTIVE ===== */

.btn:active {
    transform: translateY(-1px);
}

/* ===== BUTTON COLORS ===== */

.gis-btn {
    background: #16a34a;
}

.transformer-btn {
    background: #ea580c;
}

.feeder-btn {
    background: #ca8a04;
}

.meter-btn {
    background: #7c3aed;
}

.pole-btn {
    background: #0891b2;
}

.report-btn {
    background: #dc2626;
}

.finder-btn {
    background: #2563eb;
}

.coming-btn {
    background: #64748b;
}

/* ===== FOOTER ===== */

footer {
    position: fixed;
    bottom: 1px;
    left: 0;
    width: 100%;
    text-align: center;
    background-color: white;
    padding: 5px 0;
}

footer p {
    margin: 0;
    color: #64748b;
    font-size: 0.85rem;
}

/* ===== MOBILE ===== */

@media (max-width: 600px) {

    .container {
        width: 95%;
    }

    /* Bigger logo on phone screens */
    .logo-container img {
        width: clamp(140px, 40vw, 180px);
        height: auto;
    }

    .logo-container {
        margin-bottom: 18px;
    }

    .logo-container .logo-text {
        font-size: 0.68rem;
        letter-spacing: 1.5px;
    }

    h1 {
        font-size: 1.6rem;
    }

    .subtitle {
        margin-bottom: 30px;
    }

    .btn-container {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .btn {
        min-height: 75px;
        font-size: 1rem;
    }

    .btn i {
        font-size: 1.4rem;
    }
}

/* ===== VERY SMALL PHONES ===== */

@media (max-width: 360px) {

    .logo-container img {
        width: 130px;
    }

    h1 {
        font-size: 1.4rem;
    }

    .logo-container .logo-text {
        font-size: 0.62rem;
    }

    .btn {
        min-height: 70px;
        padding: 15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- ===== LOGO ===== -->

    <div class="logo-container">

        <img src="PHED logo.png"
             alt="PHED Logo"
             onerror="this.style.display='none'">


    </div>

    <!-- ===== HEADER ===== -->

    <h1>
        PHED Apps Hub <span>(Unofficial)</span>
    </h1>

    <p class="subtitle">
        Smart Tools for Improved Network Operations
    </p>

    <!-- ===== BUTTONS ===== -->

    <div class="btn-container">

        <!-- 2. Transformer Capture -->
        <a href="transformer-capture.html"
           class="btn transformer-btn">

            <i class="fa-solid fa-bolt"></i>
            <span>Transformer Capture</span>

        </a>
		
		
		     <!-- 4. PHED Calculator -->
        <a href="https://phedcalculator.github.io"
           class="btn meter-btn"
           target="_blank">

            <i class="fa-solid fa-calculator"></i>
            <span>PHED Calculator</span>

        </a>


   

        <!-- 5. PHED LOR -->
        <a href="https://phedlor.html"
           class="btn pole-btn"
           target="_blank">

            <i class="fa-solid fa-chart-line"></i>
            <span>PHED LOR</span>

        </a>
		
		
        <!-- 3. PHED Network Tree -->
        <a href="https://phednetwork.github.io"
           class="btn feeder-btn"
           target="_blank">

            <i class="fa-solid fa-network-wired"></i>
            <span>PHED Network Tree</span>

        </a>
		
		
		  <!-- 1. GIS Capture -->
        <a href="gis-capture.html"
           class="btn gis-btn">

            <i class="fa-solid fa-location-dot"></i>
            <span>Project GIS Capture</span>

        </a>

        <!-- 6. PHED Sage Finder -->
        <a href="https://phedsage.github.io"
           class="btn report-btn"
           target="_blank">

            <i class="fa-solid fa-magnifying-glass-chart"></i>
            <span>PHED Sage Finder</span>

        </a>

        <!-- 7. Transformer Finder -->
        <a href="dtr-finder.html"
           class="btn finder-btn">

            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Transformer Finder</span>

        </a>

        <!-- 8. Coming Soon -->
        <a href="javascript:void(0)"
           class="btn coming-btn"
           onclick="alert('This feature is coming soon!');">

            <i class="fa-solid fa-clock"></i>
            <span>Coming Soon</span>

        </a>

    </div>

</div>

<!-- ===== FOOTER ===== -->

<footer>
    <p>Designed by Obot Akpan</p>
</footer>

</body>
</html>
```
